          { id: 't4', codeKey: 't4', name: 'Tarea 4 (Unidades 7-8)', category: 'Tareas', weight: 5.0, grade: 0, isGraded: false, date: '2026-11-20' },
          { id: 'c2', codeKey: 'c2', name: 'Certamen 2 (Papel)', category: 'Certámenes', weight: 25.0, grade: 0, isGraded: false, date: '2026-11-20' },
          { id: 'ef', codeKey: 'ef', name: 'Evaluaciones Formativas (EF)', category: 'Laboratorios/Formativas', weight: 5.0, grade: 0, isGraded: false, date: '2026-11-27' },
          { id: 'eca', codeKey: 'eca', name: 'Ejercicios Autocorregidos (ECA)', category: 'Laboratorios/Formativas', weight: 5.0, grade: 0, isGraded: false, date: '2026-11-27' }
        ],
        extraConfig: { hasRecuperativo: false, recGrade: 0 }
      }
    ];

    const MONTH_NAMES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

    function App() {
      const [semesters, setSemesters] = useState([
        { id: 'sem_2026_2', name: '2026 · 2°', fullName: 'Semestre 2026-2', courses: [] }
      ]);
      const [activeSemesterId, setActiveSemesterId] = useState('sem_2026_2');
      const [activeTab, setActiveTab] = useState('my_notes'); 
      const [activeCourseId, setActiveCourseId] = useState(null);

      const [calendarViewMode, setCalendarViewMode] = useState('grid');
      const [currentYear, setCurrentYear] = useState(2026);
      const [currentMonthIdx, setCurrentMonthIdx] = useState(7); // Agosto

      const [profSearchTerm, setProfSearchTerm] = useState('');
      const [catalogSearchTerm, setCatalogSearchTerm] = useState('');
      const [customEvents, setCustomEvents] = useState([]);

      // SIMULADOR ESTADOS DE IMÁGENES DE USUARIO
      const [simSourceEvId, setSimSourceEvId] = useState('');
      const [simCalcTarget, setSimCalcTarget] = useState('global'); // 'global' | 'other'
      const [simOtherEvId, setSimOtherEvId] = useState('');
      const [simHypothesisGrade, setSimHypothesisGrade] = useState(60);

      // MODALES
      const [showRuleModal, setShowRuleModal] = useState(false);
      const [showAddSemesterModal, setShowAddSemesterModal] = useState(false);
      const [showAddCourseToSemModal, setShowAddCourseToSemModal] = useState(null);
      const [showAddEventModal, setShowAddEventModal] = useState(false);
      const [showCustomCourseModal, setShowCustomCourseModal] = useState(false);
      const [selectedDayCell, setSelectedDayCell] = useState(null);

      // FORMULARIOS DE CREACIÓN
      const [newSemName, setNewSemName] = useState('');
      const [eventTitle, setEventTitle] = useState('');
      const [eventDate, setEventDate] = useState('');
      const [eventCode, setEventCode] = useState('');
      const [eventType, setEventType] = useState('Certamen');

      const [customName, setCustomName] = useState('');
      const [customCode, setCustomCode] = useState('');
      const [customCredits, setCustomCredits] = useState(5);

      // CARGA DE LOCALSTORAGE
      useEffect(() => {
        try {
          const saved = localStorage.getItem('rumbo_usm_v6_data');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.semesters && parsed.semesters.length > 0) {
              setSemesters(parsed.semesters);
              setActiveSemesterId(parsed.activeSemesterId || parsed.semesters[0].id);
            }
            if (parsed.customEvents) setCustomEvents(parsed.customEvents);
          } else {
            const defaultSem = {
              id: 'sem_2026_2',
              name: '2026 · 2°',
              fullName: 'Semestre 2026-2',
              courses: OFFICIAL_CATALOG.map(c => ({
                ...c,
                id: 'course_' + c.code,
                evaluations: c.evaluations.map((ev, idx) => ({ ...ev, id: `ev_${c.code}_${idx}` }))
              }))
            };
            setSemesters([defaultSem]);
            setActiveCourseId('course_MAT070');
          }
        } catch (e) {
          console.error("Error al leer localStorage:", e);
        }
      }, []);

      // GUARDADO PERSISTENTE
      useEffect(() => {
        if (semesters.length > 0) {
          const payload = { semesters, activeSemesterId, customEvents };
          localStorage.setItem('rumbo_usm_v6_data', JSON.stringify(payload));
        }
      }, [semesters, activeSemesterId, customEvents]);

      const handleLogoClick = () => {
        setActiveTab('my_notes');
        if (currentSemester && currentSemester.courses.length > 0 && !activeCourseId) {
          setActiveCourseId(currentSemester.courses[0].id);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const currentSemester = useMemo(() => {
        return semesters.find(s => s.id === activeSemesterId) || semesters[0];
      }, [semesters, activeSemesterId]);

      const activeCourse = useMemo(() => {
        if (!currentSemester || !activeCourseId) return null;
        return currentSemester.courses.find(c => c.id === activeCourseId) || currentSemester.courses[0] || null;
      }, [currentSemester, activeCourseId]);

      // INICIALIZADOR DE SELECCIÓN PARA SIMULADOR
      useEffect(() => {
        if (activeCourse && activeCourse.evaluations && activeCourse.evaluations.length > 0) {
          if (!simSourceEvId || !activeCourse.evaluations.some(e => e.id === simSourceEvId)) {
            setSimSourceEvId(activeCourse.evaluations[0].id);
          }
          const otherCandidate = activeCourse.evaluations.find(e => e.id !== activeCourse.evaluations[0].id);
          if (otherCandidate && (!simOtherEvId || simOtherEvId === activeCourse.evaluations[0].id)) {
            setSimOtherEvId(otherCandidate.id);
          }
        }
      }, [activeCourse]);

      // MOTOR DE CÁLCULO DE NOTAS Y PUNTAJE ACUMULADO REAL
      const calculateCourse = (course, overrideGrades = {}) => {
        if (!course) return { finalGrade: 0, earnedPoints: 0, gradedWeight: 0, remainingWeight: 100, neededGrade: 0, statusLabel: 'Sin evaluar', statusColor: 'bg-amber-100 text-amber-900 border-amber-300' };

        const evs = (course.evaluations || []).map(e => ({
          ...e,
          grade: overrideGrades[e.id] !== undefined ? overrideGrades[e.id] : e.grade,
          isGraded: overrideGrades[e.id] !== undefined ? true : e.isGraded
        }));

        let gradedWeight = 0;
        let earnedPoints = 0;

        // MAT070: CÁLCULO
        if (course.type === 'MAT070') {
          const c1Ev = evs.find(e => e.codeKey === 'c1' || e.name.includes('C1'));
          const c2Ev = evs.find(e => e.codeKey === 'c2' || e.name.includes('C2'));
          const c3Ev = evs.find(e => e.codeKey === 'c3' || e.name.includes('C3'));

          let c1 = (c1Ev && c1Ev.isGraded) ? (parseFloat(c1Ev.grade) || 0) : 0;
          let c2 = (c2Ev && c2Ev.isGraded) ? (parseFloat(c2Ev.grade) || 0) : 0;
          let c3 = (c3Ev && c3Ev.isGraded) ? (parseFloat(c3Ev.grade) || 0) : 0;

          const controls = evs.filter(e => e.category === 'Controles' || e.codeKey?.startsWith('q'));
          let qSum = 0, qGradedCount = 0;
          controls.forEach(q => {
            if (q.isGraded) { qSum += parseFloat(q.grade) || 0; qGradedCount++; }
          });
          const pq = qGradedCount > 0 ? (qSum / qGradedCount) : 0;

          if (c1Ev && c1Ev.isGraded) { earnedPoints += 0.25 * c1; gradedWeight += 25; }
          if (c2Ev && c2Ev.isGraded) { earnedPoints += 0.25 * c2; gradedWeight += 25; }
          if (c3Ev && c3Ev.isGraded) { earnedPoints += 0.25 * c3; gradedWeight += 25; }
          if (qGradedCount > 0) {
            const pqWeight = (qGradedCount / Math.max(1, controls.length)) * 25;
            earnedPoints += (pqWeight / 100) * pq;
            gradedWeight += pqWeight;
          }

          let finalGrade = earnedPoints;
          if (overrideGrades['global'] !== undefined) {
            const glob = parseFloat(overrideGrades['global']) || 0;
            const minC = Math.min(c1, c2, c3);
            if (glob > minC) {
              finalGrade = earnedPoints + (glob - minC) * 0.25;
            }
          }

          gradedWeight = Math.round(gradedWeight);
          const remainingWeight = Math.max(0, 100 - gradedWeight);
          let neededGrade = remainingWeight > 0 ? ((PASSING_GRADE - earnedPoints) / (remainingWeight / 100)) : 0;

          let statusLabel = 'En Evaluación ⚠️';
          let statusColor = 'bg-amber-100 text-amber-900 border-amber-300';

          if (finalGrade >= PASSING_GRADE) {
            statusLabel = 'Aprobado ⚡';
            statusColor = 'bg-emerald-100 text-emerald-900 border-emerald-300';
          } else if (remainingWeight === 0) {
            statusLabel = 'Reprobado ✕';
            statusColor = 'bg-rose-100 text-rose-900 border-rose-300';
          }

          return {
            finalGrade: Math.round(finalGrade * 10) / 10,
            earnedPoints: Math.round(earnedPoints * 10) / 10,
            gradedWeight,
            remainingWeight,
            neededGrade: Math.round(neededGrade * 10) / 10,
            statusLabel, statusColor
          };
        }

        // MAT061: ÁLGEBRA LINEAL
        if (course.type === 'MAT061') {
          let certs = evs.filter(e => e.category === 'Certámenes' || e.codeKey?.startsWith('c'));
          let controls = evs.filter(e => e.category.includes('Controles') || e.codeKey?.startsWith('q'));

          let cSum = 0, cCount = 0;
          certs.forEach(c => {
            if (c.isGraded) { cSum += parseFloat(c.grade) || 0; cCount++; earnedPoints += 0.25 * parseFloat(c.grade); }
          });
          const nc = cCount > 0 ? (cSum / Math.max(1, certs.length)) : 0;

          let qSum = 0, qCount = 0;
          controls.forEach(q => {
            if (q.isGraded) { qSum += parseFloat(q.grade) || 0; qCount++; earnedPoints += (25 / Math.max(1, controls.length) / 100) * parseFloat(q.grade); }
          });
          const nq = qCount > 0 ? (qSum / Math.max(1, controls.length)) : 0;

          const asist = parseFloat(course.extraConfig?.labAsistencia ?? 100);
          const ctl1 = parseFloat(course.extraConfig?.labCtrl1 ?? 55);
          const ctl2 = parseFloat(course.extraConfig?.labCtrl2 ?? 55);
          const nl = 0.30 * asist + 0.35 * ctl1 + 0.35 * ctl2;

          let omega = nl >= 55 ? ((79 / 90) + (nl / 450)) : ((9 / 10) + (nl / 550));
          const ns = Math.min(100, (0.75 * nc + 0.25 * nq) * omega);

          gradedWeight = (cCount / Math.max(1, certs.length)) * 75 + (qCount / Math.max(1, controls.length)) * 25;
          const remainingWeight = Math.max(0, 100 - Math.round(gradedWeight));
          let neededGrade = remainingWeight > 0 ? ((PASSING_GRADE - ns) / (remainingWeight / 100)) : 0;

          let statusLabel = ns >= PASSING_GRADE ? 'Aprobado ⚡' : 'En Evaluación ⚠️';
          let statusColor = ns >= PASSING_GRADE ? 'bg-emerald-100 text-emerald-900 border-emerald-300' : 'bg-amber-100 text-amber-900 border-amber-300';

          return {
            finalGrade: Math.round(ns * 10) / 10,
            earnedPoints: Math.round(earnedPoints * 10) / 10,
            gradedWeight: Math.round(gradedWeight),
            remainingWeight: Math.round(remainingWeight),
            neededGrade: Math.round(neededGrade * 10) / 10,
            statusLabel, statusColor,
            extraLab: { nl: Math.round(nl * 10) / 10, omega: Math.round(omega * 1000) / 1000 }
          };
        }

        // FIS111: FÍSICA MECÁNICA
        if (course.type === 'FIS111') {
          let certs = evs.filter(e => e.category === 'Certámenes' || e.codeKey?.startsWith('ce'));
          let controls = evs.filter(e => e.category === 'Controles' || e.codeKey?.startsWith('co'));
          let tareas = evs.filter(e => e.category.includes('Tareas') || e.codeKey?.startsWith('ta'));

          let cSum = 0, cCount = 0;
          certs.forEach(c => {
            if (c.isGraded) { cSum += parseFloat(c.grade) || 0; cCount++; earnedPoints += 0.20 * parseFloat(c.grade); }
          });
          const pce = cCount > 0 ? (cSum / Math.max(1, certs.length)) : 0;

          let coGrades = controls.filter(c => c.isGraded).map(c => parseFloat(c.grade) || 0).sort((a,b)=>b-a);
          let top4Co = coGrades.slice(0, 4);
          const pco = top4Co.length > 0 ? (top4Co.reduce((a,b)=>a+b, 0) / top4Co.length) : 0;

          let taGrades = tareas.filter(t => t.isGraded).map(t => parseFloat(t.grade) || 0).sort((a,b)=>b-a);
          let top3Ta = taGrades.slice(0, 3);
          const pta = top3Ta.length > 0 ? (top3Ta.reduce((a,b)=>a+b, 0) / top3Ta.length) : 0;

          const nl = parseFloat(course.extraConfig?.labGrade ?? 55);
          const alpha = parseFloat(course.extraConfig?.attendanceAlpha ?? 1.0);

          let ps = alpha * (0.8 * (0.75 * pce + 0.10 * pco + 0.15 * pta) + 0.2 * nl);

          gradedWeight = (cCount / Math.max(1, certs.length)) * 60 + (coGrades.length / Math.max(1, controls.length)) * 8 + (taGrades.length / Math.max(1, tareas.length)) * 12 + 20;
          const remainingWeight = Math.max(0, 100 - Math.round(gradedWeight));
          let neededGrade = remainingWeight > 0 ? ((PASSING_GRADE - ps) / (remainingWeight / 100)) : 0;

          let statusLabel = ps >= PASSING_GRADE ? 'Aprobado ⚡' : 'En Evaluación ⚠️';
          let statusColor = ps >= PASSING_GRADE ? 'bg-emerald-100 text-emerald-900 border-emerald-300' : 'bg-amber-100 text-amber-900 border-amber-300';

          return {
            finalGrade: Math.round(ps * 10) / 10,
            earnedPoints: Math.round(earnedPoints * 10) / 10,
            gradedWeight: Math.round(gradedWeight),
            remainingWeight: Math.round(remainingWeight),
            neededGrade: Math.round(neededGrade * 10) / 10,
            statusLabel, statusColor
          };
        }

        // INF129: PROGRAMACIÓN
        if (course.type === 'INF129') {
          let certs = evs.filter(e => e.category === 'Certámenes' || e.codeKey?.startsWith('c'));
          let ctls = evs.filter(e => e.category.includes('Controles') || e.codeKey?.startsWith('ctl'));
          let tareas = evs.filter(e => e.category.includes('Tareas') || e.codeKey?.startsWith('t'));
          let formativas = evs.filter(e => e.category.includes('Laboratorios') || e.codeKey === 'ef' || e.codeKey === 'eca');

          let c1 = certs.find(e => e.codeKey === 'c1')?.isGraded ? parseFloat(certs.find(e => e.codeKey === 'c1').grade) : 0;
          let c2 = certs.find(e => e.codeKey === 'c2')?.isGraded ? parseFloat(certs.find(e => e.codeKey === 'c2').grade) : 0;
          let cAvg = (c1 + c2) / 2;

          let ctlSum = 0, ctlCnt = 0;
          ctls.forEach(c => { if(c.isGraded) { ctlSum += parseFloat(c.grade)||0; ctlCnt++; } });
          const avgCTL = ctlCnt > 0 ? (ctlSum / ctlCnt) : 0;

          let tSum = 0, tCnt = 0;
          tareas.forEach(t => { if(t.isGraded) { tSum += parseFloat(t.grade)||0; tCnt++; } });
          const avgT = tCnt > 0 ? (tSum / tCnt) : 0;

          let ef = parseFloat(formativas.find(e => e.codeKey === 'ef')?.grade || 0);
          let eca = parseFloat(formativas.find(e => e.codeKey === 'eca')?.grade || 0);

          let p = 0.50 * cAvg + 0.20 * avgCTL + 0.20 * avgT + 0.05 * ef + 0.05 * eca;
          let nf = (cAvg < 55 && (c1 > 0 || c2 > 0)) ? Math.min(cAvg, 54) : p;

          evs.forEach(e => {
            if (e.isGraded) {
              gradedWeight += e.weight;
              earnedPoints += (e.weight / 100) * (parseFloat(e.grade) || 0);
            }
          });

          const remainingWeight = Math.max(0, 100 - Math.round(gradedWeight));
          let neededGrade = remainingWeight > 0 ? ((PASSING_GRADE - p) / (remainingWeight / 100)) : 0;

          let statusLabel = nf >= PASSING_GRADE ? 'Aprobado ⚡' : 'En Evaluación ⚠️';
          let statusColor = nf >= PASSING_GRADE ? 'bg-emerald-100 text-emerald-900 border-emerald-300' : 'bg-amber-100 text-amber-900 border-amber-300';

          return {
            finalGrade: Math.round(nf * 10) / 10,
            earnedPoints: Math.round(earnedPoints * 10) / 10,
            gradedWeight: Math.round(gradedWeight),
            remainingWeight: Math.round(remainingWeight),
            neededGrade: Math.round(neededGrade * 10) / 10,
            statusLabel, statusColor
          };
        }

        // CURSO ESTÁNDAR
        evs.forEach(ev => {
          if (ev.isGraded) {
            gradedWeight += ev.weight;
            earnedPoints += (parseFloat(ev.grade) || 0) * (ev.weight / 100);
          }
        });
        const remainingWeight = Math.max(0, 100 - Math.round(gradedWeight));
        let neededGrade = remainingWeight > 0 ? ((PASSING_GRADE - earnedPoints) / (remainingWeight / 100)) : 0;

        return {
          finalGrade: Math.round(earnedPoints * 10) / 10,
          earnedPoints: Math.round(earnedPoints * 10) / 10,
          gradedWeight: Math.round(gradedWeight),
          remainingWeight: Math.round(remainingWeight),
          neededGrade: Math.round(neededGrade * 10) / 10,
          statusLabel: earnedPoints >= PASSING_GRADE ? 'Aprobado ⚡' : 'En Evaluación ⚠️',
          statusColor: earnedPoints >= PASSING_GRADE ? 'bg-emerald-100 text-emerald-900 border-emerald-300' : 'bg-amber-100 text-amber-900 border-amber-300'
        };
      };

      // PPA SEMESTRAL Y GLOBAL
      const semesterPPA = useMemo(() => {
        if (!currentSemester || currentSemester.courses.length === 0) return 0;
        let totalCredits = 0, weightedSum = 0;
        currentSemester.courses.forEach(c => {
          const res = calculateCourse(c);
          const creds = parseInt(c.credits) || 1;
          totalCredits += creds;
          weightedSum += res.finalGrade * creds;
        });
        return totalCredits > 0 ? (weightedSum / totalCredits) : 0;
      }, [currentSemester]);

      const globalPPA = useMemo(() => {
        let totalCredits = 0, weightedSum = 0;
        semesters.forEach(sem => {
          (sem.courses || []).forEach(c => {
            const res = calculateCourse(c);
            const creds = parseInt(c.credits) || 1;
            totalCredits += creds;
            weightedSum += res.finalGrade * creds;
          });
        });
        return totalCredits > 0 ? (weightedSum / totalCredits) : 0;
      }, [semesters]);

      // CALENDARIO DE EVENTOS Y COLORES POR RAMO
      const calendarEvents = useMemo(() => {
        const events = [];
        if (!currentSemester) return events;

        currentSemester.courses.forEach(c => {
          (c.evaluations || []).forEach(ev => {
            if (ev.date && ev.date.trim() !== '') {
              events.push({
                id: `ev_${c.id}_${ev.id}`,
                courseId: c.id,
                evId: ev.id,
                courseCode: c.code,
                courseName: c.name,
                title: ev.name,
                date: ev.date,
                category: ev.category || 'Evaluación',
                badgeBg: c.badgeBg || 'bg-slate-700',
                badgeText: c.badgeText || 'text-white',
                pastelBg: c.pastelBg || '#0D473B',
                pastelText: c.pastelText || '#FFFFFF',
                isSystem: true
              });
            }
          });
        });

        customEvents.forEach(ce => {
          events.push({
            id: ce.id,
            courseCode: ce.courseCode || 'USM',
            courseName: ce.courseName || 'Personal',
            title: ce.title,
            date: ce.date,
            category: ce.type || 'Hito',
            badgeBg: 'bg-slate-800',
            badgeText: 'text-white',
            pastelBg: '#1E293B',
            pastelText: '#FFFFFF',
            isSystem: false
          });
        });

        return events.sort((a, b) => new Date(a.date) - new Date(b.date));
      }, [currentSemester, customEvents]);

      // MÉTODOS DE ACTUALIZACIÓN
      const updateEvaluation = (courseId, evId, field, value) => {
        setSemesters(prevSemesters => {
          return prevSemesters.map(sem => {
            const updatedCourses = sem.courses.map(course => {
              if (course.id === courseId) {
                const updatedEvs = course.evaluations.map(ev => {
                  if (ev.id === evId) {
                    const copy = { ...ev, [field]: value };
                    if (field === 'grade') {
                      let val = parseFloat(value) || 0;
                      copy.grade = Math.max(0, Math.min(100, val));
                    }
                    return copy;
                  }
                  return ev;
                });
                return { ...course, evaluations: updatedEvs };
              }
              return course;
            });
            return { ...sem, courses: updatedCourses };
          });
        });
      };

      const updateExtraConfig = (courseId, field, value) => {
        setSemesters(prevSemesters => {
          return prevSemesters.map(sem => {
            const updatedCourses = sem.courses.map(course => {
              if (course.id === courseId) {
                return {
                  ...course,
                  extraConfig: { ...(course.extraConfig || {}), [field]: value }
                };
              }
              return course;
            });
            return { ...sem, courses: updatedCourses };
          });
        });
      };

      const handleDeleteCalendarEvent = (eventObj) => {
        if (eventObj.isSystem) {
          updateEvaluation(eventObj.courseId, eventObj.evId, 'date', '');
        } else {
          setCustomEvents(customEvents.filter(e => e.id !== eventObj.id));
        }
      };

      const handleDeleteCourseFromSemester = (semId, courseId) => {
        setSemesters(prev => prev.map(s => {
          if (s.id === semId) {
            return { ...s, courses: s.courses.filter(c => c.id !== courseId) };
          }
          return s;
        }));
        if (activeCourseId === courseId) {
          const remaining = (currentSemester?.courses || []).filter(c => c.id !== courseId);
          setActiveCourseId(remaining.length > 0 ? remaining[0].id : null);
        }
      };

      const handleCreateSemester = (e) => {
        e.preventDefault();
        if (!newSemName.trim()) return;
        const semName = newSemName.trim();
        const newSem = {
          id: 'sem_' + Date.now(),
          name: semName,
          fullName: 'Semestre ' + semName,
          courses: []
        };
        setSemesters([...semesters, newSem]);
        setActiveSemesterId(newSem.id);
        setShowAddSemesterModal(false);
        setNewSemName('');
      };

      const handleDeleteSemester = (semId) => {
        if (semesters.length <= 1) return;
        const updated = semesters.filter(s => s.id !== semId);
        setSemesters(updated);
        setActiveSemesterId(updated[0].id);
      };

      const isCourseInSemester = (semId, courseCode) => {
        const sem = semesters.find(s => s.id === semId);
        return sem ? sem.courses.some(c => c.code === courseCode) : false;
      };

      const handleAddCourseToSemester = (semId, preset) => {
        if (isCourseInSemester(semId, preset.code)) return;
        const newCourse = {
          ...preset,
          id: 'course_' + preset.code + '_' + Date.now(),
          evaluations: preset.evaluations.map((ev, idx) => ({ ...ev, id: `ev_${preset.code}_${Date.now()}_${idx}` }))
        };
        setSemesters(prev => prev.map(s => s.id === semId ? { ...s, courses: [...s.courses, newCourse] } : s));
        setShowAddCourseToSemModal(null);
        if (semId === activeSemesterId) setActiveCourseId(newCourse.id);
        if (window.confetti) window.confetti({ particleCount: 35, spread: 50, origin: { y: 0.6 } });
      };

      const handleCreateCustomCourse = (e) => {
        e.preventDefault();
        if (!customName.trim() || !showAddCourseToSemModal) return;
        const semId = showAddCourseToSemModal;
        const codeClean = customCode.trim().toUpperCase() || 'ASIG-' + Math.floor(Math.random() * 900 + 100);

        if (isCourseInSemester(semId, codeClean)) return;

        const newCourse = {
          id: 'course_custom_' + Date.now(),
          code: codeClean,
          name: customName.trim(),
          fullName: customName.trim(),
          credits: parseInt(customCredits) || 5,
          type: 'STANDARD',
          icon: 'fa-book',
          badgeBg: 'bg-[#2563EB]',
          badgeText: 'text-white',
          pastelBg: '#2563EB',
          pastelText: '#FFFFFF',
          description: 'Asignatura ingresada manualmente.',
          rules: {
            formula: 'Suma ponderada de evaluaciones',
            details: ['Porcentajes y evaluaciones totalmente personalizables.']
          },
          evaluations: [
            { id: 'ev_1', name: 'Certamen 1', category: 'Certámenes', weight: 30, grade: 0, isGraded: false, date: '' },
            { id: 'ev_2', name: 'Certamen 2', category: 'Certámenes', weight: 30, grade: 0, isGraded: false, date: '' },
            { id: 'ev_3', name: 'Certamen 3', category: 'Certámenes', weight: 30, grade: 0, isGraded: false, date: '' },
            { id: 'ev_4', name: 'Controles y Tareas', category: 'Controles', weight: 10, grade: 0, isGraded: false, date: '' },
          ],
          extraConfig: {}
        };
        setSemesters(prev => prev.map(s => s.id === semId ? { ...s, courses: [...s.courses, newCourse] } : s));
        setShowCustomCourseModal(false);
        setShowAddCourseToSemModal(null);
        setCustomName(''); setCustomCode('');
      };

      const handleAddEvent = (e) => {
        e.preventDefault();
        if (!eventTitle.trim() || !eventDate) return;
        setCustomEvents([...customEvents, {
          id: 'ce_' + Date.now(),
          title: eventTitle.trim(),
          date: eventDate,
          courseCode: eventCode.trim().toUpperCase() || 'USM',
          type: eventType
        }]);
        setShowAddEventModal(false);
        setEventTitle(''); setEventDate('');
      };

      const activeCalc = useMemo(() => calculateCourse(activeCourse), [activeCourse]);

      const groupedEvaluations = useMemo(() => {
        if (!activeCourse || !activeCourse.evaluations) return {};
        const groups = {};
        activeCourse.evaluations.forEach(ev => {
          const cat = ev.category || 'Evaluaciones Generales';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(ev);
        });
        return groups;
      }, [activeCourse]);

      const filteredProfessors = useMemo(() => {
        if (!profSearchTerm.trim()) return DMAT_PROFESSORS;
        const term = profSearchTerm.toLowerCase().trim();
        return DMAT_PROFESSORS.filter(p => 
          p.name.toLowerCase().includes(term) ||
          p.office.toLowerCase().includes(term) ||
          p.email.toLowerCase().includes(term)
        );
      }, [profSearchTerm]);

      const filteredCatalog = useMemo(() => {
        if (!catalogSearchTerm.trim()) return OFFICIAL_CATALOG;
        const term = catalogSearchTerm.toLowerCase().trim();
        return OFFICIAL_CATALOG.filter(item => 
          item.code.toLowerCase().includes(term) ||
          item.name.toLowerCase().includes(term) ||
          item.fullName.toLowerCase().includes(term)
        );
      }, [catalogSearchTerm]);

      // REJILLA MENSUAL DEL CALENDARIO
      const calendarGridDays = useMemo(() => {
        const year = currentYear;
        const month = currentMonthIdx;
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);

        let startingDayOfWeek = firstDay.getDay();
        startingDayOfWeek = startingDayOfWeek === 0 ? 6 : startingDayOfWeek - 1;

        const totalDays = lastDay.getDate();
        const daysArray = [];

        for (let i = 0; i < startingDayOfWeek; i++) {
          daysArray.push({ dayNumber: null, dateStr: null, isCurrentMonth: false });
        }

        for (let d = 1; d <= totalDays; d++) {
          const monthStr = String(month + 1).padStart(2, '0');
          const dayStr = String(d).padStart(2, '0');
          const dateStr = `${year}-${monthStr}-${dayStr}`;

          const dayEvents = calendarEvents.filter(ev => ev.date === dateStr);
          daysArray.push({
            dayNumber: d,
            dateStr,
            isCurrentMonth: true,
            events: dayEvents
          });
        }
        return daysArray;
      }, [currentYear, currentMonthIdx, calendarEvents]);

      // GENERADOR DE ESCENARIOS DEL SIMULADOR EXACTO A LAS IMÁGENES
      const simulationRows = useMemo(() => {
        if (!activeCourse || !activeCourse.evaluations || !simSourceEvId) return [];

        const testScores = [20, 40, 60, 80, 100];
        const sourceEv = activeCourse.evaluations.find(e => e.id === simSourceEvId);
        if (!sourceEv) return [];

        return testScores.map(scoreVal => {
          let reqTargetGrade = 0;
          let scenarioStatus = 'Cumples las reglas';

          // Hipótesis base para otras pendientes
          const tempGrades = {};
          activeCourse.evaluations.forEach(ev => {
            if (ev.id === simSourceEvId) {
              tempGrades[ev.id] = scoreVal;
            } else if (!ev.isGraded) {
              tempGrades[ev.id] = simHypothesisGrade;
            }
          });

          if (simCalcTarget === 'global') {
            // Requerimiento en Certamen Global
            let minNeeded = 101;
            for (let g = 0; g <= 100; g += 0.5) {
              const testOver = { ...tempGrades, 'global': g };
              const calc = calculateCourse(activeCourse, testOver);
              if (calc.finalGrade >= PASSING_GRADE) {
                minNeeded = g;
                break;
              }
            }

            if (minNeeded <= 100) {
              reqTargetGrade = minNeeded;
              scenarioStatus = 'Apruebas con Global';
            } else {
              reqTargetGrade = 100;
              scenarioStatus = 'Requiere recuperativo previo';
            }
          } else {
            // Requerimiento en otra nota pendiente elegida
            const targetEv = activeCourse.evaluations.find(e => e.id === simOtherEvId);
            if (!targetEv) return { sourceGrade: scoreVal, needed: 0, status: 'N/A' };

            let minNeeded = 101;
            for (let g = 0; g <= 100; g += 0.5) {
              const testOver = { ...tempGrades, [targetEv.id]: g };
              const calc = calculateCourse(activeCourse, testOver);
              if (calc.finalGrade >= PASSING_GRADE) {
                minNeeded = g;
                break;
              }
            }

            reqTargetGrade = minNeeded <= 100 ? minNeeded : 100;
            scenarioStatus = minNeeded <= 100 ? 'Cumples las reglas' : 'Insuficiente (max > 100)';
          }

          return {
            sourceGrade: scoreVal,
            needed: reqTargetGrade,
            status: scenarioStatus
          };
        });
      }, [activeCourse, simSourceEvId, simCalcTarget, simOtherEvId, simHypothesisGrade]);

      const handleApplySimulationRow = (row) => {
        if (!activeCourse || !simSourceEvId) return;
        updateEvaluation(activeCourse.id, simSourceEvId, 'grade', row.sourceGrade);
        updateEvaluation(activeCourse.id, simSourceEvId, 'isGraded', true);

        if (simCalcTarget === 'global') {
          updateExtraConfig(activeCourse.id, 'hasGlobal', true);
          updateExtraConfig(activeCourse.id, 'globalGrade', row.needed);
        } else if (simOtherEvId) {
          updateEvaluation(activeCourse.id, simOtherEvId, 'grade', row.needed);
          updateEvaluation(activeCourse.id, simOtherEvId, 'isGraded', true);
        }
      };

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-[#F6F7F2]">
          
          {/* BARRA LATERAL (SIDEBAR) */}
          <aside className="w-full md:w-72 bg-[#FAFBF6] border-b md:border-b-0 md:border-r border-[#EAECE6] flex flex-col flex-shrink-0">
            
            <div className="p-5 border-b border-[#EAECE6] flex items-center justify-between">
              <button 
                onClick={handleLogoClick}
                className="flex items-center gap-3 text-left focus:outline-none group"
                title="Ir al inicio de Rumbo"
              >
                <div className="w-10 h-10 rounded-2xl bg-[#0D473B] flex items-center justify-center text-white font-bold text-xl shadow-md group-hover:scale-105 transition-transform">
                  <i className="fa-solid fa-book-bookmark text-sm text-[#10B981]"></i>
                </div>
                <div>
                  <div className="font-extrabold text-2xl tracking-tight text-slate-900 leading-none">
                    rumbo<span className="text-[#10B981]">.</span>
                  </div>
                  <span className="text-[11px] font-medium text-slate-500 block mt-0.5">Tus notas, tu próximo paso...</span>
                </div>
              </button>
            </div>

            <div className="px-5 py-4 border-b border-[#EAECE6]">
              <div className="bg-[#EAECE6]/80 rounded-2xl p-1.5 flex items-center justify-between">
                <span className="text-xs font-semibold text-slate-600 pl-3">Mi semestre</span>
                <select
                  value={activeSemesterId}
                  onChange={(e) => setActiveSemesterId(e.target.value)}
                  className="bg-white text-slate-900 font-extrabold text-xs rounded-xl px-3 py-1.5 border border-[#EAECE6] shadow-xs focus:outline-none cursor-pointer"
                >
                  {semesters.map(s => (
                    <option key={s.id} value={s.id}>{s.name}</option>
                  ))}
                </select>
              </div>
            </div>

            <div className="p-3 space-y-1 text-xs font-bold border-b border-[#EAECE6]">
              <button
                onClick={() => setActiveTab('my_notes')}
                className={`w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl transition-all ${
                  activeTab === 'my_notes'
                    ? 'bg-[#EAECE6]/90 text-slate-900 shadow-xs'
                    : 'text-slate-600 hover:bg-[#EAECE6]/40'
                }`}
              >
                <i className="fa-solid fa-chart-simple w-4 text-center text-slate-700"></i>
                <span>Mis notas</span>
              </button>

              <button
                onClick={() => setActiveTab('calendar')}
                className={`w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl transition-all ${
                  activeTab === 'calendar'
                    ? 'bg-[#EAECE6]/90 text-slate-900 shadow-xs'
                    : 'text-slate-600 hover:bg-[#EAECE6]/40'
                }`}
              >
                <i className="fa-solid fa-calendar-days w-4 text-center text-slate-700"></i>
                <span>Calendario de evaluaciones</span>
              </button>

              <button
                onClick={() => setActiveTab('office_hours')}
                className={`w-full flex items-center justify-between px-3.5 py-3 rounded-2xl transition-all ${
                  activeTab === 'office_hours'
                    ? 'bg-[#0D473B] text-white shadow-xs'
                    : 'text-slate-600 hover:bg-[#EAECE6]/40'
                }`}
              >
                <div className="flex items-center gap-3">
                  <i className="fa-solid fa-clock-user w-4 text-center"></i>
                  <span>Horarios de consulta (DMat)</span>
                </div>
                <span className="text-[9px] font-black px-1.5 py-0.5 rounded-full bg-emerald-500 text-white">
                  49 Profs
                </span>
              </button>
            </div>

            <div className="flex-1 overflow-y-auto p-3 space-y-1">
              <div className="flex items-center justify-between px-3 py-2 text-[10px] font-black text-slate-400 uppercase tracking-wider">
                <span>Mis Asignaturas ({currentSemester?.courses.length || 0})</span>
                <button
                  onClick={() => setShowAddCourseToSemModal(activeSemesterId)}
                  className="hover:text-[#0D473B] transition-colors"
                  title="Añadir ramo a este semestre"
                >
                  <i className="fa-solid fa-plus text-xs"></i>
                </button>
              </div>

              {currentSemester?.courses.length === 0 ? (
                <div className="text-center py-6 px-3 text-xs text-slate-400 font-medium">
                  Sin ramos inscritos en este semestre.
                </div>
              ) : (
                currentSemester.courses.map(course => {
                  const isActive = activeCourseId === course.id && activeTab === 'my_notes';
                  const res = calculateCourse(course);

                  return (
                    <div key={course.id} className="group flex items-center gap-1">
                      <button
                        onClick={() => {
                          setActiveCourseId(course.id);
                          setActiveTab('my_notes');
                        }}
                        className={`flex-1 text-left p-2.5 rounded-2xl transition-all flex items-center justify-between ${
                          isActive
                            ? 'bg-[#0D473B] text-white shadow-md'
                            : 'hover:bg-[#EAECE6]/50 text-slate-800'
                        }`}
                      >
                        <div className="flex items-center gap-2.5 min-w-0 pr-1">
                          <div
                            className={`w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0 text-xs font-bold shadow-xs ${
                              isActive ? 'bg-white/20 text-white' : ''
                            }`}
                            style={!isActive ? { backgroundColor: course.pastelBg, color: course.pastelText } : {}}
                          >
                            <i className={`fa-solid ${course.icon || 'fa-book'}`}></i>
                          </div>
                          <div className="truncate">
                            <div className="font-extrabold text-xs truncate leading-snug">{course.name}</div>
                            <div className={`text-[10px] font-semibold ${isActive ? 'text-emerald-200' : 'text-slate-400'}`}>
                              {course.code}
                            </div>
                          </div>
                        </div>

                        <div className="text-right flex-shrink-0 pl-1">
                          <div className={`font-black text-xs ${
                            isActive 
                              ? 'text-white' 
                              : res.finalGrade >= PASSING_GRADE 
                              ? 'text-emerald-700' 
                              : 'text-amber-700'
                          }`}>
                            {res.finalGrade.toFixed(1)}
                          </div>
                        </div>
                      </button>

                      <button
                        onClick={() => handleDeleteCourseFromSemester(activeSemesterId, course.id)}
                        className="p-2 text-slate-300 hover:text-rose-600 rounded-xl hover:bg-rose-50 transition-colors"
                        title="Quitar ramo"
                      >
                        <i className="fa-solid fa-trash-can text-xs"></i>
                      </button>
                    </div>
                  );
                })
              )}
            </div>

            <div className="p-3 border-t border-[#EAECE6] space-y-1 text-xs font-bold">
              <button
                onClick={() => setActiveTab('catalog')}
                className="w-full flex items-center justify-center gap-2 py-2.5 bg-white border border-[#EAECE6] rounded-2xl hover:bg-[#EAECE6]/40 text-slate-700 transition-colors"
              >
                <i className="fa-solid fa-square-plus text-[#0D473B]"></i>
                <span>Catálogo de Ramos USM</span>
              </button>
              <button
                onClick={() => setActiveTab('library')}
                className="w-full flex items-center justify-center gap-2 py-2.5 bg-white border border-[#EAECE6] rounded-2xl hover:bg-[#EAECE6]/40 text-slate-700 transition-colors"
              >
                <i className="fa-solid fa-landmark text-[#0D473B]"></i>
                <span>Biblioteca de Semestres</span>
              </button>
            </div>
          </aside>

          {/* ÁREA PRINCIPAL */}
          <main className="flex-1 overflow-y-auto p-4 sm:p-8 max-w-5xl mx-auto w-full space-y-6">

            {/* TAB: MIS NOTAS */}
            {activeTab === 'my_notes' && (
              <div className="space-y-6">
                
                {activeCourse ? (
                  <>
                    {/* HERO CARD DE RAMO */}
                    <div className="rumbo-hero-gradient text-white rounded-3xl p-6 sm:p-8 shadow-lg border border-[#0D473B] flex flex-col justify-between gap-6 relative overflow-hidden">
                      
                      <div className="flex items-start justify-between gap-4">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="px-3 py-1 rounded-full text-xs font-black bg-white/10 border border-white/20 uppercase tracking-wide">
                              {activeCourse.code}
                            </span>
                            <span className="text-xs font-semibold text-emerald-200">
                              {activeCourse.credits} SCT
                            </span>
                          </div>
                          <h2 className="text-2xl sm:text-3xl font-black mt-2 leading-tight">
                            {activeCourse.fullName || activeCourse.name}
                          </h2>
                        </div>

                        <button
                          onClick={() => setShowRuleModal(true)}
                          className="px-4 py-2 bg-white/15 hover:bg-white/25 text-white font-extrabold text-xs rounded-full border border-white/30 backdrop-blur-md transition-all flex items-center gap-2 flex-shrink-0"
                        >
                          <i className="fa-solid fa-book-open"></i>
                          <span>Ver reglas</span>
                        </button>
                      </div>

                      <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4 pt-2">
                        <div>
                          <div className="text-[11px] font-black uppercase text-emerald-200 tracking-wider">
                            Nota Proyectada / Final
                          </div>
                          <div className="flex items-baseline gap-3">
                            <span className="text-6xl sm:text-7xl font-black tracking-tighter text-white">
                              {activeCalc.finalGrade.toFixed(1)}
                            </span>
                            <span className="text-sm font-semibold text-emerald-200">
                              / 100.0
                            </span>
                          </div>
                        </div>

                        <div className="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-4 sm:text-right space-y-1">
                          <span className="text-[10px] font-black uppercase text-emerald-200 tracking-wider block">
                            Puntaje Acumulado Actual
                          </span>
                          <div className="text-2xl sm:text-3xl font-black text-white">
                            {activeCalc.earnedPoints.toFixed(1)} <span className="text-xs font-semibold text-emerald-200">/ 100.0 pts</span>
                          </div>
                        </div>
                      </div>

                      {/* NOTAS NECESARIAS PARA APROBAR */}
                      <div className="bg-white/10 backdrop-blur-md border border-white/25 rounded-2xl p-5 space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-extrabold uppercase text-emerald-200 flex items-center gap-2">
                            <i className="fa-solid fa-bullseye text-[#10B981] text-sm"></i>
                            ¿Qué necesito para aprobar con 55?
                          </span>
                          <span className={`px-3 py-1 rounded-full text-xs font-black border ${activeCalc.statusColor}`}>
                            {activeCalc.statusLabel}
                          </span>
                        </div>

                        <div className="text-lg sm:text-xl font-extrabold text-white leading-relaxed">
                          {activeCalc.remainingWeight > 0 ? (
                            activeCalc.neededGrade <= 0 ? (
                              <span className="text-emerald-200">
                                ¡Felicidades! Ya acumulaste <strong className="text-white text-2xl font-black">{activeCalc.earnedPoints.toFixed(1)} pts</strong>. Aprobaste directamente esta asignatura. 🥳
                              </span>
                            ) : activeCalc.neededGrade > 100 ? (
                              <span className="text-rose-200">
                                Para llegar a 55 necesitas promediar <strong className="text-rose-300 text-2xl font-black">{activeCalc.neededGrade.toFixed(1)}</strong> en las evaluaciones pendientes ({activeCalc.remainingWeight}%). Se requiere rendir certamen recuperativo / global. 🚨
                              </span>
                            ) : (
                              <span>
                                Para aprobar el ramo con 55, necesitas obtener una nota promedio de{' '}
                                <span className="inline-block px-3 py-1 bg-[#10B981] text-slate-900 font-black text-2xl sm:text-3xl rounded-xl shadow-md mx-1">
                                  {activeCalc.neededGrade.toFixed(1)}
                                </span>{' '}
                                en el <strong className="text-emerald-200">{activeCalc.remainingWeight}%</strong> de evaluaciones pendientes.
                              </span>
                            )
                          ) : (
                            <span className="text-emerald-100 text-base">
                              Has completado el 100% de las evaluaciones de este ramo. Nota final obtenida: <strong className="text-white text-xl font-black">{activeCalc.finalGrade.toFixed(1)}</strong>.
                            </span>
                          )}
                        </div>
                      </div>

                      <div className="space-y-1.5 pt-1 border-t border-white/10">
                        <div className="flex justify-between text-xs font-bold text-emerald-200">
                          <span>Evaluado: {activeCalc.gradedWeight}%</span>
                          <span>Pendiente: {activeCalc.remainingWeight}%</span>
                        </div>
                        <div className="w-full bg-white/15 rounded-full h-2.5 overflow-hidden">
                          <div 
                            className="bg-[#10B981] h-full rounded-full transition-all duration-500" 
                            style={{ width: `${activeCalc.gradedWeight}%` }}
                          ></div>
                        </div>
                      </div>

                    </div>

                    {/* CONFIGURACIÓN DE LABORATORIO & ASISTENCIA */}
                    {activeCourse.type === 'MAT061' && (
                      <div className="bg-white rounded-3xl p-5 border border-[#EAECE6] shadow-xs space-y-3">
                        <div className="flex items-center justify-between border-b border-[#EAECE6] pb-2">
                          <span className="font-black text-xs text-slate-900 flex items-center gap-2">
                            <i className="fa-solid fa-microchip text-purple-700"></i>
                            Laboratorio de Computación (Factor Omega ω)
                          </span>
                          <span className="font-extrabold text-xs text-purple-900 bg-purple-50 px-2.5 py-1 rounded-full border border-purple-200">
                            NL = {activeCalc.extraLab?.nl} | Factor ω = {activeCalc.extraLab?.omega}
                          </span>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                          <div>
                            <label className="font-bold text-slate-600 block mb-1">Asistencia Lab (%)</label>
                            <input
                              type="number" min="0" max="100"
                              value={activeCourse.extraConfig?.labAsistencia ?? 100}
                              onChange={(e) => updateExtraConfig(activeCourse.id, 'labAsistencia', e.target.value)}
                              className="w-full bg-[#FAFBF6] border border-[#EAECE6] rounded-xl px-3 py-1.5 font-black text-center"
                            />
                          </div>
                          <div>
                            <label className="font-bold text-slate-600 block mb-1">Control 1 Lab (0-100)</label>
                            <input
                              type="number" min="0" max="100"
                              value={activeCourse.extraConfig?.labCtrl1 ?? 55}
                              onChange={(e) => updateExtraConfig(activeCourse.id, 'labCtrl1', e.target.value)}
                              className="w-full bg-[#FAFBF6] border border-[#EAECE6] rounded-xl px-3 py-1.5 font-black text-center"
                            />
                          </div>
                          <div>
                            <label className="font-bold text-slate-600 block mb-1">Control 2 Lab (0-100)</label>
                            <input
                              type="number" min="0" max="100"
                              value={activeCourse.extraConfig?.labCtrl2 ?? 55}
                              onChange={(e) => updateExtraConfig(activeCourse.id, 'labCtrl2', e.target.value)}
                              className="w-full bg-[#FAFBF6] border border-[#EAECE6] rounded-xl px-3 py-1.5 font-black text-center"
                            />
                          </div>
                        </div>
                      </div>
                    )}

                    {activeCourse.type === 'FIS111' && (
                      <div className="bg-white rounded-3xl p-5 border border-[#EAECE6] shadow-xs space-y-3">
                        <div className="flex items-center justify-between border-b border-[#EAECE6] pb-2">
                          <span className="font-black text-xs text-slate-900 flex items-center gap-2">
                            <i className="fa-solid fa-flask text-emerald-700"></i>
                            Laboratorio de Física y Asistencia General
                          </span>
                          <span className="font-extrabold text-xs text-emerald-900 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">
                            Exigencia: NL ≥ 55
                          </span>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                          <div>
                            <label className="font-bold text-slate-600 block mb-1">Nota Final Laboratorio NL (20%)</label>
                            <input
                              type="number" min="0" max="100"
                              value={activeCourse.extraConfig?.labGrade ?? 55}
                              onChange={(e) => updateExtraConfig(activeCourse.id, 'labGrade', e.target.value)}
                              className="w-full bg-[#FAFBF6] border border-[#EAECE6] rounded-xl px-3 py-1.5 font-black text-center"
                            />
                          </div>
                          <div>
                            <label className="font-bold text-slate-600 block mb-1">Factor de Asistencia α</label>
                            <select
                              value={activeCourse.extraConfig?.attendanceAlpha ?? 1.0}
                              onChange={(e) => updateExtraConfig(activeCourse.id, 'attendanceAlpha', parseFloat(e.target.value))}
                              className="w-full bg-[#FAFBF6] border border-[#EAECE6] rounded-xl px-3 py-1.5 font-extrabold text-center"
                            >
                              <option value="1.0">α = 1.0 (Asistencia ≥ 80%)</option>
                              <option value="0.5">α = 0.5 (Asistencia &lt; 80%)</option>
                            </select>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* AGRUPACIÓN DE EVALUACIONES */}
                    <div className="space-y-4">
                      <div className="flex items-center justify-between">
                        <h3 className="font-extrabold text-lg text-slate-900">Evaluaciones y Ponderaciones</h3>
                        <span className="text-xs text-slate-400 font-bold">Divididas por tipo</span>
                      </div>

                      {Object.keys(groupedEvaluations).map(categoryName => {
                        const evList = groupedEvaluations[categoryName];
                        const gradedInGroup = evList.filter(e => e.isGraded).length;

                        return (
                          <div key={categoryName} className="bg-white rounded-3xl border border-[#EAECE6] shadow-xs overflow-hidden">
                            <div className="bg-[#FAFBF6] px-5 py-3 border-b border-[#EAECE6] flex items-center justify-between">
                              <div className="flex items-center gap-2">
                                <span className="w-2.5 h-2.5 rounded-full bg-[#0D473B]"></span>
                                <h4 className="font-black text-sm text-slate-900">{categoryName}</h4>
                                <span className="text-xs font-bold text-slate-400">({evList.length})</span>
                              </div>
                              <span className="text-xs font-bold text-slate-500">
                                {gradedInGroup} de {evList.length} evaluados
                              </span>
                            </div>

                            <div className="overflow-x-auto">
                              <table className="w-full text-left text-xs sm:text-sm">
                                <thead className="bg-[#FAFBF6]/50 text-slate-400 font-extrabold uppercase text-[10px] tracking-wider border-b border-[#EAECE6]">
                                  <tr>
                                    <th className="py-2.5 px-4 w-12 text-center">Rendido</th>
                                    <th className="py-2.5 px-4">Evaluación</th>
                                    <th className="py-2.5 px-4 w-28">Ponderación</th>
                                    <th className="py-2.5 px-4 w-36">Nota (0 - 100)</th>
                                    <th className="py-2.5 px-4 w-44">Fecha</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-[#EAECE6]">
                                  {evList.map(ev => (
                                    <tr key={ev.id} className="hover:bg-[#FAFBF6] transition-colors">
                                      <td className="py-3 px-4 text-center">
                                        <input
                                          type="checkbox"
                                          checked={ev.isGraded}
                                          onChange={(e) => updateEvaluation(activeCourse.id, ev.id, 'isGraded', e.target.checked)}
                                          className="w-4.5 h-4.5 text-[#0D473B] rounded border-gray-300 cursor-pointer"
                                        />
                                      </td>
                                      <td className="py-3 px-4 font-bold text-slate-900">
                                        {ev.name}
                                      </td>
                                      <td className="py-3 px-4 font-bold text-slate-500">
                                        {ev.weight}%
                                      </td>
                                      <td className="py-3 px-4">
                                        <input
                                          type="number"
                                          min="0" max="100"
                                          disabled={!ev.isGraded}
                                          value={ev.grade}
                                          onChange={(e) => updateEvaluation(activeCourse.id, ev.id, 'grade', e.target.value)}
                                          className={`w-24 border rounded-xl px-3 py-1.5 font-black text-center text-sm transition-all ${
                                            !ev.isGraded
                                              ? 'bg-[#EAECE6]/50 text-slate-400 border-[#EAECE6] cursor-not-allowed opacity-50'
                                              : 'bg-white text-slate-900 border-[#EAECE6] shadow-xs focus:ring-2 focus:ring-[#0D473B]'
                                          }`}
                                        />
                                      </td>
                                      <td className="py-3 px-4">
                                        <div className="flex items-center gap-1">
                                          <input
                                            type="date"
                                            value={ev.date || ''}
                                            onChange={(e) => updateEvaluation(activeCourse.id, ev.id, 'date', e.target.value)}
                                            className="bg-[#FAFBF6] border border-[#EAECE6] rounded-xl px-2.5 py-1 text-xs font-bold text-slate-800 focus:outline-none focus:border-[#0D473B]"
                                          />
                                          {ev.date && (
                                            <button
                                              onClick={() => updateEvaluation(activeCourse.id, ev.id, 'date', '')}
                                              className="p-1 text-slate-300 hover:text-rose-600 rounded-lg transition-colors"
                                              title="Borrar fecha"
                                            >
                                              <i className="fa-solid fa-xmark text-xs"></i>
                                            </button>
                                          )}
                                        </div>
                                      </td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {/* SIMULADOR INTERACTIVO DE ESCENARIOS (RÉPLICA DE IMÁGENES) */}
                    <div className="bg-white rounded-3xl p-6 border border-[#EAECE6] shadow-xs space-y-5">
                      <div className="flex items-center justify-between border-b border-[#EAECE6] pb-3">
                        <div>
                          <span className="text-[10px] font-black uppercase text-purple-700 tracking-wider block">HAY MÁS DE UN CAMINO</span>
                          <h3 className="text-xl font-black text-slate-900 leading-tight">¿Y si te va mejor en otra evaluación?</h3>
                          <p className="text-xs text-slate-500">Compara combinaciones y elige una para simular en tiempo real.</p>
                        </div>
                        <div className="w-9 h-9 rounded-2xl bg-purple-100 text-purple-800 flex items-center justify-center font-bold text-sm">
                          <i className="fa-solid fa-[#fa-flask]"></i>🧪
                        </div>
                      </div>

                      {/* CONTROLES DEL SIMULADOR */}
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                        <div>
                          <label className="font-bold text-slate-600 block mb-1">Si en...</label>
                          <select
                            value={simSourceEvId}
                            onChange={(e) => setSimSourceEvId(e.target.value)}
                            className="w-full bg-[#FAFBF6] border border-[#EAECE6] rounded-xl px-3 py-2 font-extrabold text-slate-900 focus:outline-none focus:border-[#0D473B]"
                          >
                            {activeCourse.evaluations.map(ev => (
                              <option key={ev.id} value={ev.id}>{ev.name}</option>
                            ))}
                          </select>
                        </div>

                        <div>
                          <label className="font-bold text-slate-600 block mb-1">Quiero calcular...</label>
                          <select
                            value={simCalcTarget}
                            onChange={(e) => setSimCalcTarget(e.target.value)}
                            className="w-full bg-[#FAFBF6] border border-[#EAECE6] rounded-xl px-3 py-2 font-extrabold text-slate-900 focus:outline-none focus:border-[#0D473B]"
                          >
                            <option value="global">Certamen Global / Recuperativo</option>
                            <option value="other">Otra nota pendiente</option>
                          </select>
                        </div>

                        {simCalcTarget === 'other' && (
                          <div>
                            <label className="font-bold text-slate-600 block mb-1">Cuánto necesito en...</label>
                            <select
                              value={simOtherEvId}
                              onChange={(e) => setSimOtherEvId(e.target.value)}
                              className="w-full bg-[#FAFBF6] border border-[#EAECE6] rounded-xl px-3 py-2 font-extrabold text-slate-900 focus:outline-none focus:border-[#0D473B]"
                            >
                              {activeCourse.evaluations.filter(ev => ev.id !== simSourceEvId).map(ev => (
                                <option key={ev.id} value={ev.id}>{ev.name}</option>
                              ))}
                            </select>
                          </div>
                        )}
                      </div>

                      {/* BANNER DE HIPÓTESIS EDITABLE */}
                      <div className="bg-purple-50/70 border border-purple-200 rounded-2xl p-3.5 flex items-center justify-between text-xs text-purple-900">
                        <div className="flex items-center gap-2">
                          <span>Para las otras evaluaciones pendientes, supongamos:</span>
                          <input
                            type="number" min="0" max="100"
                            value={simHypothesisGrade}
                            onChange={(e) => setSimHypothesisGrade(parseFloat(e.target.value) || 0)}
                            className="w-16 bg-white border border-purple-300 rounded-lg px-2 py-1 font-black text-center"
                          />
                          <span>en cada una.</span>
                        </div>
                        <span className="text-[11px] font-semibold text-purple-600 hidden sm:inline">Es una hipótesis editable</span>
                      </div>

                      {/* TABLA DE ESCENARIOS (20, 40, 60, 80, 100) */}
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs sm:text-sm">
                          <thead className="bg-[#FAFBF6]/60 text-slate-400 font-extrabold uppercase text-[10px] tracking-wider border-b border-[#EAECE6]">
                            <tr>
                              <th className="py-2.5 px-4">Si sacas en {activeCourse.evaluations.find(e => e.id === simSourceEvId)?.name}</th>
                              <th className="py-2.5 px-4">
                                {simCalcTarget === 'global' ? '¿Necesitas rendirlo? Global' : `Necesitas en ${activeCourse.evaluations.find(e => e.id === simOtherEvId)?.name}`}
                              </th>
                              <th className="py-2.5 px-4">Con ese resultado</th>
                              <th className="py-2.5 px-4 text-right">Simular</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-[#EAECE6]">
                            {simulationRows.map((row, idx) => (
                              <tr key={idx} className="hover:bg-[#FAFBF6] transition-colors">
                                <td className="py-3 px-4 font-black text-xl text-slate-900">
                                  {row.sourceGrade}
                                </td>
                                <td className="py-3 px-4">
                                  <div className="font-black text-lg text-slate-900">{row.needed.toFixed(1)}</div>
                                  <span className="text-[10px] font-semibold text-slate-400">Mínimo para aprobar</span>
                                </td>
                                <td className="py-3 px-4 text-xs font-semibold text-slate-600">
                                  {row.status}
                                </td>
                                <td className="py-3 px-4 text-right">
                                  <button
                                    onClick={() => handleApplySimulationRow(row)}
                                    className="px-4 py-1.5 bg-emerald-100 hover:bg-emerald-200 text-emerald-900 font-black text-xs rounded-xl transition-all shadow-2xs inline-flex items-center gap-1.5"
                                  >
                                    <span>Probar</span>
                                    <i className="fa-solid fa-arrow-right text-[10px]"></i>
                                  </button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>

                    </div>
                  </>
                ) : (
                  <div className="bg-white rounded-3xl p-10 text-center border border-[#EAECE6] shadow-xs space-y-4 my-8">
                    <div className="w-16 h-16 mx-auto rounded-2xl bg-[#F6F7F2] flex items-center justify-center text-[#0D473B] text-3xl">
                      <i className="fa-solid fa-graduation-cap"></i>
                    </div>
                    <h3 className="text-xl font-black text-slate-900">Bienvenido a Rumbo USM</h3>
                    <p className="text-xs text-slate-500 max-w-md mx-auto">
                      Selecciona o añade asignaturas para comenzar a calcular notas y ponderaciones.
                    </p>
                    <button
                      onClick={() => setShowAddCourseToSemModal(activeSemesterId)}
                      className="px-6 py-3 bg-[#0D473B] hover:bg-[#09362C] text-white font-extrabold text-xs rounded-2xl shadow-md transition-all inline-flex items-center gap-2"
                    >
                      <i className="fa-solid fa-square-plus"></i>
                      <span>Añadir Ramo a este Semestre</span>
                    </button>
                  </div>
                )}

              </div>
            )}

            {/* TAB: HORARIOS DE CONSULTA DMAT */}
            {activeTab === 'office_hours' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-2xl font-black text-slate-900">Horarios de Consulta DMat</h2>
                    <p className="text-xs text-slate-500">Atención presencial de profesores del Departamento de Matemática (Campus San Joaquín 2026-2).</p>
                  </div>

                  <div className="relative w-full sm:w-72">
                    <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                    <input
                      type="text"
                      placeholder="Buscar por profesor u oficina (ej. Geyssel, A-162)..."
                      value={profSearchTerm}
                      onChange={(e) => setProfSearchTerm(e.target.value)}
                      className="w-full bg-white border border-[#EAECE6] rounded-2xl pl-9 pr-3 py-2 font-bold text-xs text-slate-900 shadow-xs focus:outline-none focus:border-[#0D473B]"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  {filteredProfessors.map(prof => (
                    <div key={prof.id} className="bg-white rounded-3xl p-5 border border-[#EAECE6] shadow-xs hover:border-[#0D473B] transition-all space-y-3">
                      <div className="flex items-start justify-between">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-2xl bg-[#0D473B] text-white font-bold flex items-center justify-center text-sm shadow-xs">
                            {prof.name.substring(0, 2).toUpperCase()}
                          </div>
                          <div>
                            <h3 className="font-extrabold text-sm text-slate-900">{prof.name}</h3>
                            <span className="text-[10px] font-bold text-slate-400">Departamento de Matemática</span>
                          </div>
                        </div>
                        <span className="px-2.5 py-1 rounded-full text-[10px] font-black bg-emerald-50 text-emerald-900 border border-emerald-200">
                          {prof.office}
                        </span>
                      </div>

                      <div className="space-y-1.5 text-xs border-t border-[#EAECE6] pt-3">
                        <div className="flex items-center gap-2 text-slate-600 font-medium">
                          <i className="fa-solid fa-clock text-[#0D473B] w-4 text-center"></i>
                          <span>{prof.hours}</span>
                        </div>
                        <div className="flex items-center gap-2 text-slate-600 font-medium truncate">
                          <i className="fa-solid fa-envelope text-[#0D473B] w-4 text-center"></i>
                          <a href={`mailto:${prof.email}`} className="text-[#0D473B] hover:underline truncate">
                            {prof.email}
                          </a>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: CALENDARIO DE EVALUACIONES */}
            {activeTab === 'calendar' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-2xl font-black text-slate-900">Calendario de Evaluaciones</h2>
                    <p className="text-xs text-slate-500">Haz clic en cualquier día para ver o gestionar evaluaciones de esa fecha.</p>
                  </div>

                  <div className="flex items-center gap-2">
                    <div className="bg-white border border-[#EAECE6] p-1 rounded-2xl flex items-center shadow-xs">
                      <button
                        onClick={() => setCalendarViewMode('grid')}
                        className={`px-3 py-1.5 rounded-xl font-extrabold text-xs transition-all flex items-center gap-1.5 ${
                          calendarViewMode === 'grid'
                            ? 'bg-[#0D473B] text-white shadow-xs'
                            : 'text-slate-600 hover:bg-[#FAFBF6]'
                        }`}
                      >
                        <i className="fa-solid fa-calendar-grid"></i>
                        <span>Vista Rejilla Mensual</span>
                      </button>

                      <button
                        onClick={() => setCalendarViewMode('list')}
                        className={`px-3 py-1.5 rounded-xl font-extrabold text-xs transition-all flex items-center gap-1.5 ${
                          calendarViewMode === 'list'
                            ? 'bg-[#0D473B] text-white shadow-xs'
                            : 'text-slate-600 hover:bg-[#FAFBF6]'
                        }`}
                      >
                        <i className="fa-solid fa-list-ul"></i>
                        <span>Vista Lista</span>
                      </button>
                    </div>

                    <button
                      onClick={() => setShowAddEventModal(true)}
                      className="px-3.5 py-2.5 bg-[#0D473B] hover:bg-[#09362C] text-white font-extrabold text-xs rounded-2xl shadow-xs transition-all flex items-center gap-2"
                    >
                      <i className="fa-solid fa-plus"></i>
                      <span>Añadir Fecha</span>
                    </button>
                  </div>
                </div>

                {calendarViewMode === 'grid' && (
                  <div className="bg-white rounded-3xl border border-[#EAECE6] shadow-xs p-6 space-y-6">
                    <div className="flex items-center justify-between border-b border-[#EAECE6] pb-4">
                      <div className="flex items-center gap-3">
                        <h3 className="font-black text-xl text-slate-900">
                          {MONTH_NAMES[currentMonthIdx]} {currentYear}
                        </h3>
                        <span className="text-xs font-extrabold text-[#0D473B] bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200">
                          2026 USM
                        </span>
                      </div>

                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => {
                            if (currentMonthIdx === 0) {
                              setCurrentMonthIdx(11);
                              setCurrentYear(currentYear - 1);
                            } else {
                              setCurrentMonthIdx(currentMonthIdx - 1);
                            }
                          }}
                          className="w-9 h-9 rounded-xl border border-[#EAECE6] hover:bg-[#FAFBF6] flex items-center justify-center text-slate-700 font-bold"
                        >
                          <i className="fa-solid fa-chevron-left"></i>
                        </button>

                        <button
                          onClick={() => {
                            setCurrentMonthIdx(7);
                            setCurrentYear(2026);
                          }}
                          className="px-3 py-1.5 rounded-xl border border-[#EAECE6] hover:bg-[#FAFBF6] text-xs font-bold text-slate-700"
                        >
                          Hoy
                        </button>

                        <button
                          onClick={() => {
                            if (currentMonthIdx === 11) {
                              setCurrentMonthIdx(0);
                              setCurrentYear(currentYear + 1);
                            } else {
                              setCurrentMonthIdx(currentMonthIdx + 1);
                            }
                          }}
                          className="w-9 h-9 rounded-xl border border-[#EAECE6] hover:bg-[#FAFBF6] flex items-center justify-center text-slate-700 font-bold"
                        >
                          <i className="fa-solid fa-chevron-right"></i>
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-7 gap-2 text-center text-xs font-black text-slate-400 uppercase tracking-wider">
                      <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
                    </div>

                    <div className="grid grid-cols-7 gap-2">
                      {calendarGridDays.map((cell, idx) => {
                        if (!cell.isCurrentMonth) {
                          return <div key={idx} className="min-h-[90px] bg-[#FAFBF6]/40 rounded-2xl border border-transparent"></div>;
                        }

                        const hasEvents = cell.events && cell.events.length > 0;

                        return (
                          <div
                            key={idx}
                            onClick={() => setSelectedDayCell(cell)}
                            className={`min-h-[95px] p-2 rounded-2xl border transition-all cursor-pointer flex flex-col justify-between ${
                              hasEvents 
                                ? 'bg-white border-emerald-300 shadow-xs ring-2 ring-emerald-500/10 hover:border-[#0D473B]' 
                                : 'bg-white border-[#EAECE6] hover:border-slate-300'
                            }`}
                          >
                            <div className="flex items-center justify-between">
