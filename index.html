          { id: 't4', codeKey: 't4', name: 'Tarea 4 (Unidades 7-8)', category: 'Tareas', weight: 5.0, grade: '', isGraded: false, date: '2026-11-20' },
          { id: 'c2', codeKey: 'c2', name: 'Certamen 2 (Papel)', category: 'Certámenes', weight: 25.0, grade: '', isGraded: false, date: '2026-11-20' },
          { id: 'ef', codeKey: 'ef', name: 'Evaluaciones Formativas (EF)', category: 'Laboratorios/Formativas', weight: 5.0, grade: '', isGraded: false, date: '2026-11-27' },
          { id: 'eca', codeKey: 'eca', name: 'Ejercicios Autocorregidos (ECA)', category: 'Laboratorios/Formativas', weight: 5.0, grade: '', isGraded: false, date: '2026-11-27' }
        ],
        extraConfig: { globalGrade: '' }
      }
    ];

    const MONTH_NAMES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

    function App() {
      // ESTADO GLOBAL
      const [semesters, setSemesters] = useState([]);
      const [activeSemesterId, setActiveSemesterId] = useState('');
      const [activeTab, setActiveTab] = useState('my_notes');
      const [activeCourseId, setActiveCourseId] = useState(null);

      const [catalog, setCatalog] = useState([]);
      const [customEvents, setCustomEvents] = useState([]);

      // BÚSQUEDAS Y FILTROS
      const [profSearchTerm, setProfSearchTerm] = useState('');
      const [catalogSearchTerm, setCatalogSearchTerm] = useState('');

      // CALENDARIO
      const [calendarViewMode, setCalendarViewMode] = useState('grid');
      const [currentYear, setCurrentYear] = useState(2026);
      const [currentMonthIdx, setCurrentMonthIdx] = useState(9); // Octubre 2026

      // MODALES
      const [showRuleModal, setShowRuleModal] = useState(false);
      const [showAddSemesterModal, setShowAddSemesterModal] = useState(false);
      const [showAddCourseToSemModal, setShowAddCourseToSemModal] = useState(null);
      const [showAddEventModal, setShowAddEventModal] = useState(false);
      const [showCustomCourseModal, setShowCustomCourseModal] = useState(false);
      const [showAutoParserModal, setShowAutoParserModal] = useState(false);
      const [selectedDayCell, setSelectedDayCell] = useState(null);

      // FORMULARIO DE SIMULADOR
      const [simSourceEvId, setSimSourceEvId] = useState('');
      const [simTargetType, setSimTargetType] = useState('next');

      // FORMULARIOS DE MODAL
      const [newSemName, setNewSemName] = useState('');
      const [eventTitle, setEventTitle] = useState('');
      const [eventDate, setEventDate] = useState('');
      const [eventCourseCode, setEventCourseCode] = useState('');

      const [customName, setCustomName] = useState('');
      const [customCode, setCustomCode] = useState('');
      const [customCredits, setCustomCredits] = useState(6);
      const [customHex, setCustomHex] = useState('#2563EB');

      const [pautaInputText, setPautaInputText] = useState('');

      // CARGA DE LOCALSTORAGE
      useEffect(() => {
        try {
          const saved = localStorage.getItem('rumbo_usm_v7_data');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.semesters && parsed.semesters.length > 0) {
              setSemesters(parsed.semesters);
              setActiveSemesterId(parsed.activeSemesterId || parsed.semesters[0].id);
            }
            if (parsed.catalog && parsed.catalog.length > 0) {
              setCatalog(parsed.catalog);
            } else {
              setCatalog(DEFAULT_CATALOG);
            }
            if (parsed.customEvents) setCustomEvents(parsed.customEvents);
          } else {
            const defaultSem = {
              id: 'sem_2026_2',
              name: '2026 · 2° Semestre',
              fullName: 'Semestre 2026 - 2°',
              courses: DEFAULT_CATALOG.map(c => ({
                ...c,
                id: 'course_' + c.code,
                evaluations: c.evaluations.map((ev, idx) => ({ ...ev, id: `ev_${c.code}_${idx}` }))
              }))
            };
            setSemesters([defaultSem]);
            setActiveSemesterId(defaultSem.id);
            setCatalog(DEFAULT_CATALOG);
            setActiveCourseId('course_MAT070');
          }
        } catch (e) {
          console.error("Error al cargar localStorage:", e);
        }
      }, []);

      // GUARDADO AUTOMÁTICO EN LOCALSTORAGE
      useEffect(() => {
        if (semesters.length > 0) {
          const payload = { semesters, activeSemesterId, catalog, customEvents };
          localStorage.setItem('rumbo_usm_v7_data', JSON.stringify(payload));
        }
      }, [semesters, activeSemesterId, catalog, customEvents]);

      const currentSemester = useMemo(() => {
        return semesters.find(s => s.id === activeSemesterId) || semesters[0];
      }, [semesters, activeSemesterId]);

      const activeCourse = useMemo(() => {
        if (!currentSemester || !activeCourseId) return null;
        return currentSemester.courses.find(c => c.id === activeCourseId) || currentSemester.courses[0] || null;
      }, [currentSemester, activeCourseId]);

      // FIX PARA INGRESO RÁPIDO DE NOTAS (SIN CEROS A LA IZQUIERDA COMO 070)
      const sanitizeGradeInput = (val) => {
        if (val === '' || val === null || val === undefined) return '';
        let str = String(val).trim();
        // Eliminar ceros sobrantes al inicio a menos que sea sólo '0' o decimal '0.'
        if (/^0\d+/.test(str)) {
          str = str.replace(/^0+/, '');
        }
        const num = parseFloat(str);
        if (isNaN(num)) return '';
        return Math.max(0, Math.min(100, num));
      };

      // MOTOR DE CÁLCULO DE NOTAS Y PUNTAJES EN TIEMPO REAL
      const calculateCourse = (course, overrideGrades = {}) => {
        if (!course) {
          return {
            finalGrade: 0,
            earnedPoints: 0,
            gradedWeight: 0,
            remainingWeight: 100,
            neededGrade: 0,
            certAvg: 0,
            labGrade: 55,
            conditions: [{ text: 'Nota final ≥ 55.0', passed: false, label: 'Pendiente' }]
          };
        }

        const evs = (course.evaluations || []).map(e => {
          const overVal = overrideGrades[e.id];
          const hasOverride = overVal !== undefined && overVal !== '';
          const gradeVal = hasOverride ? parseFloat(overVal) : parseFloat(e.grade);
          const isGraded = hasOverride ? true : (e.isGraded || (!isNaN(gradeVal) && e.grade !== ''));
          return {
            ...e,
            grade: !isNaN(gradeVal) ? gradeVal : 0,
            isGraded: !!isGraded
          };
        });

        let gradedWeight = 0;
        let earnedPoints = 0;

        // CÁLCULO ESPECÍFICO MAT070
        if (course.type === 'MAT070') {
          const c1Ev = evs.find(e => e.codeKey === 'c1');
          const c2Ev = evs.find(e => e.codeKey === 'c2');
          const c3Ev = evs.find(e => e.codeKey === 'c3');

          let c1 = c1Ev && c1Ev.isGraded ? c1Ev.grade : 0;
          let c2 = c2Ev && c2Ev.isGraded ? c2Ev.grade : 0;
          let c3 = c3Ev && c3Ev.isGraded ? c3Ev.grade : 0;

          const controls = evs.filter(e => e.category === 'Controles');
          let qSum = 0, qCnt = 0;
          controls.forEach(q => { if (q.isGraded) { qSum += q.grade; qCnt++; } });
          const pq = qCnt > 0 ? (qSum / qCnt) : 0;

          if (c1Ev && c1Ev.isGraded) { earnedPoints += 0.25 * c1; gradedWeight += 25; }
          if (c2Ev && c2Ev.isGraded) { earnedPoints += 0.25 * c2; gradedWeight += 25; }
          if (c3Ev && c3Ev.isGraded) { earnedPoints += 0.25 * c3; gradedWeight += 25; }
          if (qCnt > 0) {
            const w = (qCnt / Math.max(1, controls.length)) * 25;
            earnedPoints += (w / 100) * pq;
            gradedWeight += w;
          }

          let finalGrade = earnedPoints;
          const globalVal = overrideGrades['global'] !== undefined 
            ? parseFloat(overrideGrades['global']) 
            : parseFloat(course.extraConfig?.globalGrade);

          if (!isNaN(globalVal) && globalVal > 0) {
            const minC = Math.min(c1, c2, c3);
            if (globalVal > minC) {
              finalGrade = earnedPoints + (globalVal - minC) * 0.25;
            }
          }

          gradedWeight = Math.round(gradedWeight);
          const remainingWeight = Math.max(0, 100 - gradedWeight);
          const neededGrade = remainingWeight > 0 ? Math.max(0, (PASSING_GRADE - earnedPoints) / (remainingWeight / 100)) : 0;

          const isPassed = finalGrade >= PASSING_GRADE;

          return {
            finalGrade: Math.round(finalGrade * 10) / 10,
            earnedPoints: Math.round(earnedPoints * 10) / 10,
            gradedWeight,
            remainingWeight,
            neededGrade: Math.round(neededGrade * 10) / 10,
            conditions: [
              {
                text: 'Nota final ≥ 55.0',
                passed: isPassed,
                label: isPassed ? 'Cumplida ✓' : (remainingWeight > 0 ? 'Pendiente' : 'Incumplida ✕')
              }
            ]
          };
        }

        // CÁLCULO ESPECÍFICO MAT061
        if (course.type === 'MAT061') {
          let certs = evs.filter(e => e.category === 'Certámenes');
          let controls = evs.filter(e => e.category === 'Controles');

          let cSum = 0, cCount = 0;
          certs.forEach(c => { if (c.isGraded) { cSum += c.grade; cCount++; earnedPoints += 0.25 * c.grade; } });
          const nc = cCount > 0 ? (cSum / Math.max(1, certs.length)) : 0;

          let qSum = 0, qCount = 0;
          controls.forEach(q => { if (q.isGraded) { qSum += q.grade; qCount++; earnedPoints += (25 / Math.max(1, controls.length) / 100) * q.grade; } });
          const nq = qCount > 0 ? (qSum / Math.max(1, controls.length)) : 0;

          const asist = parseFloat(course.extraConfig?.labAsistencia ?? 100);
          const ctl1 = parseFloat(course.extraConfig?.labCtrl1 ?? 55);
          const ctl2 = parseFloat(course.extraConfig?.labCtrl2 ?? 55);
          const nl = 0.30 * asist + 0.35 * ctl1 + 0.35 * ctl2;

          let omega = nl >= 55 ? ((79 / 90) + (nl / 450)) : ((9 / 10) + (nl / 550));
          const ns = Math.min(100, (0.75 * nc + 0.25 * nq) * omega);

          gradedWeight = (cCount / Math.max(1, certs.length)) * 75 + (qCount / Math.max(1, controls.length)) * 25;
          const remainingWeight = Math.max(0, 100 - Math.round(gradedWeight));
          const neededGrade = remainingWeight > 0 ? Math.max(0, (PASSING_GRADE - ns) / (remainingWeight / 100)) : 0;

          return {
            finalGrade: Math.round(ns * 10) / 10,
            earnedPoints: Math.round(earnedPoints * 10) / 10,
            gradedWeight: Math.round(gradedWeight),
            remainingWeight: Math.round(remainingWeight),
            neededGrade: Math.round(neededGrade * 10) / 10,
            labGrade: Math.round(nl * 10) / 10,
            conditions: [
              { text: 'Nota final ≥ 55.0', passed: ns >= PASSING_GRADE, label: ns >= PASSING_GRADE ? 'Cumplida ✓' : (remainingWeight > 0 ? 'Pendiente' : 'Incumplida ✕') },
              { text: 'Nota de Laboratorio ≥ 55.0', passed: nl >= 55.0, label: nl >= 55.0 ? 'Cumplida ✓' : 'Incumplida ✕' }
            ]
          };
        }

        // CÁLCULO ESPECÍFICO FIS111
        if (course.type === 'FIS111') {
          let certs = evs.filter(e => e.category === 'Certámenes');
          let controls = evs.filter(e => e.category === 'Controles');
          let tareas = evs.filter(e => e.category === 'Tareas');

          let cSum = 0, cCount = 0;
          certs.forEach(c => { if (c.isGraded) { cSum += c.grade; cCount++; earnedPoints += 0.20 * c.grade; } });
          const pce = cCount > 0 ? (cSum / cCount) : 0;

          let coGrades = controls.filter(c => c.isGraded).map(c => c.grade).sort((a,b)=>b-a);
          let top4Co = coGrades.slice(0, 4);
          const pco = top4Co.length > 0 ? (top4Co.reduce((a,b)=>a+b, 0) / top4Co.length) : 0;

          let taGrades = tareas.filter(t => t.isGraded).map(t => t.grade).sort((a,b)=>b-a);
          let top3Ta = taGrades.slice(0, 3);
          const pta = top3Ta.length > 0 ? (top3Ta.reduce((a,b)=>a+b, 0) / top3Ta.length) : 0;

          const nl = parseFloat(course.extraConfig?.labGrade ?? 55);
          const alpha = parseFloat(course.extraConfig?.attendanceAlpha ?? 1.0);

          let ps = alpha * (0.8 * (0.75 * pce + 0.10 * pco + 0.15 * pta) + 0.2 * nl);

          gradedWeight = (cCount / Math.max(1, certs.length)) * 60 + (coGrades.length / Math.max(1, controls.length)) * 8 + (taGrades.length / Math.max(1, tareas.length)) * 12 + 20;
          const remainingWeight = Math.max(0, 100 - Math.round(gradedWeight));
          const neededGrade = remainingWeight > 0 ? Math.max(0, (PASSING_GRADE - ps) / (remainingWeight / 100)) : 0;

          return {
            finalGrade: Math.round(ps * 10) / 10,
            earnedPoints: Math.round(earnedPoints * 10) / 10,
            gradedWeight: Math.round(gradedWeight),
            remainingWeight: Math.round(remainingWeight),
            neededGrade: Math.round(neededGrade * 10) / 10,
            certAvg: Math.round(pce * 10) / 10,
            labGrade: Math.round(nl * 10) / 10,
            conditions: [
              { text: 'Nota final ≥ 55.0', passed: ps >= PASSING_GRADE, label: ps >= PASSING_GRADE ? 'Cumplida ✓' : (remainingWeight > 0 ? 'Pendiente' : 'Incumplida ✕') },
              { text: 'Promedio Certámenes ≥ 50.0', passed: pce >= 50.0, label: pce >= 50.0 ? 'Cumplida ✓' : (cCount < certs.length ? 'Pendiente' : 'Incumplida ✕') },
              { text: 'Nota de Laboratorio ≥ 55.0', passed: nl >= 55.0, label: nl >= 55.0 ? 'Cumplida ✓' : 'Incumplida ✕' }
            ]
          };
        }

        // CÁLCULO ESTÁNDAR
        evs.forEach(ev => {
          if (ev.isGraded) {
            gradedWeight += ev.weight;
            earnedPoints += ev.grade * (ev.weight / 100);
          }
        });
        const remainingWeight = Math.max(0, 100 - Math.round(gradedWeight));
        const neededGrade = remainingWeight > 0 ? Math.max(0, (PASSING_GRADE - earnedPoints) / (remainingWeight / 100)) : 0;

        return {
          finalGrade: Math.round(earnedPoints * 10) / 10,
          earnedPoints: Math.round(earnedPoints * 10) / 10,
          gradedWeight: Math.round(gradedWeight),
          remainingWeight: Math.round(remainingWeight),
          neededGrade: Math.round(neededGrade * 10) / 10,
          conditions: [
            { text: 'Nota final ≥ 55.0', passed: earnedPoints >= PASSING_GRADE, label: earnedPoints >= PASSING_GRADE ? 'Cumplida ✓' : (remainingWeight > 0 ? 'Pendiente' : 'Incumplida ✕') }
          ]
        };
      };

      // EVALUACIONES PENDIENTES DE NOTA EN EL RAMO ACTIVO
      const pendingEvaluations = useMemo(() => {
        if (!activeCourse || !activeCourse.evaluations) return [];
        return activeCourse.evaluations.filter(e => !e.isGraded && (e.grade === '' || e.grade === null || e.grade === undefined));
      }, [activeCourse]);

      // INICIALIZADOR DE SIMULADOR PENDIENTE
      useEffect(() => {
        if (pendingEvaluations.length > 0) {
          if (!simSourceEvId || !pendingEvaluations.some(e => e.id === simSourceEvId)) {
            setSimSourceEvId(pendingEvaluations[0].id);
          }
        } else if (activeCourse && activeCourse.evaluations && activeCourse.evaluations.length > 0) {
          setSimSourceEvId(activeCourse.evaluations[0].id);
        }
      }, [activeCourse, pendingEvaluations]);

      // MÉTODOS DE ACTUALIZACIÓN DE NOTAS
      const updateEvaluation = (courseId, evId, field, value) => {
        setSemesters(prevSemesters => {
          return prevSemesters.map(sem => {
            const updatedCourses = sem.courses.map(course => {
              if (course.id === courseId) {
                const updatedEvs = course.evaluations.map(ev => {
                  if (ev.id === evId) {
                    const copy = { ...ev, [field]: value };
                    if (field === 'grade') {
                      const cleanVal = sanitizeGradeInput(value);
                      copy.grade = cleanVal;
                      copy.isGraded = cleanVal !== '';
                    }
                    return copy;
                  }
                  return ev;
                });
                return { ...course, evaluations: updatedEvs };
              }
              return course;
            });
            return { ...sem, courses: updatedCourses };
          });
        });
      };

      const updateGlobalGrade = (courseId, value) => {
        const cleanVal = sanitizeGradeInput(value);
        setSemesters(prevSemesters => {
          return prevSemesters.map(sem => {
            const updatedCourses = sem.courses.map(course => {
              if (course.id === courseId) {
                return {
                  ...course,
                  extraConfig: { ...(course.extraConfig || {}), globalGrade: cleanVal }
                };
              }
              return course;
            });
            return { ...sem, courses: updatedCourses };
          });
        });
      };

      // ACCIONES DE GESTIÓN DE RAMOS Y SEMESTRES
      const handleAddCourseToSemester = (semId, preset) => {
        const sem = semesters.find(s => s.id === semId);
        if (sem && sem.courses.some(c => c.code === preset.code)) return;

        const newCourse = {
          ...preset,
          id: 'course_' + preset.code + '_' + Date.now(),
          evaluations: preset.evaluations.map((ev, idx) => ({ ...ev, id: `ev_${preset.code}_${Date.now()}_${idx}` }))
        };

        setSemesters(prev => prev.map(s => s.id === semId ? { ...s, courses: [...s.courses, newCourse] } : s));
        setShowAddCourseToSemModal(null);
        if (semId === activeSemesterId) setActiveCourseId(newCourse.id);
        if (window.confetti) window.confetti({ particleCount: 35, spread: 50, origin: { y: 0.6 } });
      };

      const handleDeleteCourseFromSemester = (semId, courseId) => {
        setSemesters(prev => prev.map(s => {
          if (s.id === semId) {
            return { ...s, courses: s.courses.filter(c => c.id !== courseId) };
          }
          return s;
        }));
        if (activeCourseId === courseId) {
          const remaining = (currentSemester?.courses || []).filter(c => c.id !== courseId);
          setActiveCourseId(remaining.length > 0 ? remaining[0].id : null);
        }
      };

      const handleCreateSemester = (e) => {
        e.preventDefault();
        if (!newSemName.trim()) return;
        const semName = newSemName.trim();
        const newSem = {
          id: 'sem_' + Date.now(),
          name: semName,
          fullName: 'Semestre ' + semName,
          courses: []
        };
        setSemesters([...semesters, newSem]);
        setActiveSemesterId(newSem.id);
        setShowAddSemesterModal(false);
        setNewSemName('');
      };

      const handleDeleteSemester = (semId) => {
        if (semesters.length <= 1) return alert("Debes mantener al menos un semestre activo.");
        const updated = semesters.filter(s => s.id !== semId);
        setSemesters(updated);
        setActiveSemesterId(updated[0].id);
      };

      // EVENTOS DE CALENDARIO
      const handleAddEvent = (e) => {
        e.preventDefault();
        if (!eventTitle.trim() || !eventDate) return;
        const code = eventCourseCode || 'PERSONAL';
        setCustomEvents([...customEvents, {
          id: 'ce_' + Date.now(),
          title: eventTitle.trim(),
          date: eventDate,
          courseCode: code,
          type: code === 'PERSONAL' ? 'Personal' : 'Evaluación'
        }]);
        setShowAddEventModal(false);
        setEventTitle(''); setEventDate(''); setEventCourseCode('');
      };

      const handleDeleteCalendarEvent = (eventObj) => {
        if (eventObj.isSystem) {
          updateEvaluation(eventObj.courseId, eventObj.evId, 'date', '');
        } else {
          setCustomEvents(customEvents.filter(e => e.id !== eventObj.id));
        }
      };

      // GESTIÓN DEL CATÁLOGO DESDE ADMINISTRADOR
      const handleCreateCatalogCourse = (e) => {
        e.preventDefault();
        if (!customName.trim()) return;
        const codeClean = customCode.trim().toUpperCase() || 'ASIG' + Math.floor(Math.random() * 900 + 100);

        const newTemplate = {
          code: codeClean,
          name: customName.trim(),
          fullName: customName.trim(),
          credits: parseInt(customCredits) || 6,
          type: 'STANDARD',
          icon: 'fa-book',
          badgeBg: 'bg-[#2563EB]',
          badgeText: 'text-white',
          pastelBg: customHex,
          pastelText: '#FFFFFF',
          description: 'Asignatura personalizada agregada desde el Panel de Administrador.',
          rules: {
            formula: 'NP = Suma Ponderada de Evaluaciones',
            details: ['Porcentajes totalmente personalizables.', 'Aprobación directa con NP ≥ 55.0.']
          },
          conditionsList: [{ key: 'finalGrade', label: 'Nota final ≥ 55.0', threshold: 55.0 }],
          evaluations: [
            { id: 'ev_1', name: 'Certamen 1', category: 'Certámenes', weight: 30, grade: '', isGraded: false, date: '' },
            { id: 'ev_2', name: 'Certamen 2', category: 'Certámenes', weight: 30, grade: '', isGraded: false, date: '' },
            { id: 'ev_3', name: 'Certamen 3', category: 'Certámenes', weight: 30, grade: '', isGraded: false, date: '' },
            { id: 'ev_4', name: 'Controles y Tareas', category: 'Controles', weight: 10, grade: '', isGraded: false, date: '' }
          ],
          extraConfig: { globalGrade: '' }
        };

        setCatalog([...catalog, newTemplate]);
        setShowCustomCourseModal(false);
        setCustomName(''); setCustomCode('');
        alert(`¡Asignatura ${codeClean} creada en el catálogo con éxito!`);
      };

      const handleDeleteCatalogCourse = (codeToDelete) => {
        if (confirm(`¿Seguro que deseas eliminar el ramo ${codeToDelete} del catálogo?`)) {
          setCatalog(catalog.filter(c => c.code !== codeToDelete));
        }
      };

      // CREADOR AUTOMÁTICO DE RAMOS POR PAUTA/DOCUMENTO (SMART PARSER)
      const handleAutoParsePauta = (e) => {
        e.preventDefault();
        if (!pautaInputText.trim()) return;

        const text = pautaInputText;
        const codeMatch = text.match(/([A-Z]{3}-?\d{3})/i);
        const codeClean = codeMatch ? codeMatch[1].replace('-', '').toUpperCase() : 'RAMO' + Math.floor(Math.random() * 900 + 100);

        const nameMatch = text.match(/Asignatura:\s*([^\n]+)/i) || text.match(/Curso:\s*([^\n]+)/i) || text.match(/Nombre:\s*([^\n]+)/i);
        const nameClean = nameMatch ? nameMatch[1].trim() : `Asignatura ${codeClean}`;

        const sctMatch = text.match(/(\d+)\s*SCT/i) || text.match(/créditos:\s*(\d+)/i);
        const sctClean = sctMatch ? parseInt(sctMatch[1]) : 6;

        const newTemplate = {
          code: codeClean,
          name: nameClean,
          fullName: nameClean,
          credits: sctClean,
          type: 'PARSED',
          icon: 'fa-brain',
          badgeBg: 'bg-[#0D473B]',
          badgeText: 'text-white',
          pastelBg: '#0D473B',
          pastelText: '#FFFFFF',
          description: 'Ramo generado automáticamente mediante análisis inteligente de pauta.',
          rules: {
            formula: 'NP = Evaluación Automática',
            details: ['Estructura procesada desde el reglamento ingresado.']
          },
          conditionsList: [{ key: 'finalGrade', label: 'Nota final ≥ 55.0', threshold: 55.0 }],
          evaluations: [
            { id: 'ev_1', name: 'Certamen 1 (C1)', category: 'Certámenes', weight: 25, grade: '', isGraded: false, date: '' },
            { id: 'ev_2', name: 'Certamen 2 (C2)', category: 'Certámenes', weight: 25, grade: '', isGraded: false, date: '' },
            { id: 'ev_3', name: 'Certamen 3 (C3)', category: 'Certámenes', weight: 25, grade: '', isGraded: false, date: '' },
            { id: 'ev_4', name: 'Evaluaciones Taller/Controles', category: 'Controles', weight: 25, grade: '', isGraded: false, date: '' }
          ],
          extraConfig: { globalGrade: '' }
        };

        setCatalog([...catalog, newTemplate]);
        setShowAutoParserModal(false);
        setPautaInputText('');
        alert(`🤖 ¡Ramo ${codeClean} (${nameClean}) procesado y añadido al catálogo exitosamente!`);
      };

      // PPA CALCULATIONS
      const semesterPPA = useMemo(() => {
        if (!currentSemester || currentSemester.courses.length === 0) return 0;
        let totalCredits = 0, weightedSum = 0;
        currentSemester.courses.forEach(c => {
          const res = calculateCourse(c);
          const creds = parseInt(c.credits) || 1;
          totalCredits += creds;
          weightedSum += res.finalGrade * creds;
        });
        return totalCredits > 0 ? (weightedSum / totalCredits) : 0;
      }, [currentSemester]);

      const globalPPA = useMemo(() => {
        let totalCredits = 0, weightedSum = 0;
        semesters.forEach(sem => {
          (sem.courses || []).forEach(c => {
            const res = calculateCourse(c);
            const creds = parseInt(c.credits) || 1;
            totalCredits += creds;
            weightedSum += res.finalGrade * creds;
          });
        });
        return totalCredits > 0 ? (weightedSum / totalCredits) : 0;
      }, [semesters]);

      // PROCESADOR DE SIMULACIONES
      const simulationRows = useMemo(() => {
        if (!activeCourse || !activeCourse.evaluations) return [];

        const sourceEv = activeCourse.evaluations.find(e => e.id === simSourceEvId) || activeCourse.evaluations[0];
        if (!sourceEv) return [];

        const testScores = [20, 40, 60, 80, 100];

        return testScores.map(scoreVal => {
          let neededScore = 0;

          if (simTargetType === 'global') {
            let minNeeded = 101;
            for (let g = 0; g <= 100; g += 0.5) {
              const testOver = { [sourceEv.id]: scoreVal, 'global': g };
              const calc = calculateCourse(activeCourse, testOver);
              if (calc.finalGrade >= PASSING_GRADE) {
                minNeeded = g;
                break;
              }
            }
            neededScore = minNeeded <= 100 ? minNeeded : 100;
          } else {
            // Nota en la siguiente evaluación pendiente
            const nextPending = pendingEvaluations.find(e => e.id !== sourceEv.id);
            if (!nextPending) {
              const calc = calculateCourse(activeCourse, { [sourceEv.id]: scoreVal });
              neededScore = calc.neededGrade;
            } else {
              let minNeeded = 101;
              for (let g = 0; g <= 100; g += 0.5) {
                const testOver = { [sourceEv.id]: scoreVal, [nextPending.id]: g };
                const calc = calculateCourse(activeCourse, testOver);
                if (calc.finalGrade >= PASSING_GRADE) {
                  minNeeded = g;
                  break;
                }
              }
              neededScore = minNeeded <= 100 ? minNeeded : 100;
            }
          }

          return {
            sourceGrade: scoreVal,
            needed: neededScore
          };
        });
      }, [activeCourse, simSourceEvId, simTargetType, pendingEvaluations]);

      const activeCalc = useMemo(() => calculateCourse(activeCourse), [activeCourse]);

      const calendarEvents = useMemo(() => {
        const events = [];
        if (!currentSemester) return events;

        currentSemester.courses.forEach(c => {
          (c.evaluations || []).forEach(ev => {
            if (ev.date && ev.date.trim() !== '') {
              events.push({
                id: `ev_${c.id}_${ev.id}`,
                courseId: c.id,
                evId: ev.id,
                courseCode: c.code,
                courseName: c.name,
                title: ev.name,
                date: ev.date,
                category: ev.category || 'Evaluación',
                badgeBg: c.badgeBg || 'bg-[#0D473B]',
                badgeText: c.badgeText || 'text-white',
                pastelBg: c.pastelBg || '#0D473B',
                pastelText: c.pastelText || '#FFFFFF',
                isSystem: true
              });
            }
          });
        });

        customEvents.forEach(ce => {
          const isPersonal = ce.courseCode === 'PERSONAL';
          const matchCourse = currentSemester.courses.find(c => c.code === ce.courseCode);

          events.push({
            id: ce.id,
            courseCode: isPersonal ? 'PERSONAL' : (matchCourse ? matchCourse.code : ce.courseCode),
            courseName: isPersonal ? 'Evento Personal' : (matchCourse ? matchCourse.name : 'Asignatura'),
            title: ce.title,
            date: ce.date,
            category: ce.type || 'Hito',
            badgeBg: isPersonal ? 'bg-[#111827]' : (matchCourse ? matchCourse.badgeBg : 'bg-slate-800'),
            badgeText: 'text-white',
            pastelBg: isPersonal ? '#111827' : (matchCourse ? matchCourse.pastelBg : '#1E293B'),
            pastelText: '#FFFFFF',
            isSystem: false
          });
        });

        return events.sort((a, b) => new Date(a.date) - new Date(b.date));
      }, [currentSemester, customEvents]);

      // REJILLA MENSUAL CALENDARIO
      const calendarGridDays = useMemo(() => {
        const year = currentYear;
        const month = currentMonthIdx;
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);

        let startingDayOfWeek = firstDay.getDay();
        startingDayOfWeek = startingDayOfWeek === 0 ? 6 : startingDayOfWeek - 1;

        const totalDays = lastDay.getDate();
        const daysArray = [];

        for (let i = 0; i < startingDayOfWeek; i++) {
          daysArray.push({ dayNumber: null, dateStr: null, isCurrentMonth: false });
        }

        for (let d = 1; d <= totalDays; d++) {
          const monthStr = String(month + 1).padStart(2, '0');
          const dayStr = String(d).padStart(2, '0');
          const dateStr = `${year}-${monthStr}-${dayStr}`;

          const dayEvents = calendarEvents.filter(ev => ev.date === dateStr);
          daysArray.push({
            dayNumber: d,
            dateStr,
            isCurrentMonth: true,
            events: dayEvents
          });
        }
        return daysArray;
      }, [currentYear, currentMonthIdx, calendarEvents]);

      const filteredProfessors = useMemo(() => {
        if (!profSearchTerm.trim()) return DMAT_PROFESSORS;
        const term = profSearchTerm.toLowerCase().trim();
        return DMAT_PROFESSORS.filter(p => 
          p.name.toLowerCase().includes(term) ||
          p.office.toLowerCase().includes(term) ||
          p.email.toLowerCase().includes(term)
        );
      }, [profSearchTerm]);

      const filteredCatalog = useMemo(() => {
        if (!catalogSearchTerm.trim()) return catalog;
        const term = catalogSearchTerm.toLowerCase().trim();
        return catalog.filter(item => 
          item.code.toLowerCase().includes(term) ||
          item.name.toLowerCase().includes(term) ||
          item.fullName.toLowerCase().includes(term)
        );
      }, [catalogSearchTerm, catalog]);

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-[#F6F7F2]">
          
          {/* HEADER PRINCIPAL */}
          <header className="fixed top-0 left-0 right-0 h-16 bg-white border-b border-[#E2E4DC] px-4 sm:px-6 flex items-center justify-between z-40">
            <button 
              onClick={() => { setActiveTab('my_notes'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
              className="flex items-center gap-3 group focus:outline-none"
            >
              <div className="w-9 h-9 rounded-xl bg-[#0D473B] text-white flex items-center justify-center font-black text-lg shadow-xs group-hover:scale-105 transition-transform">
                R
              </div>
              <div className="text-left">
                <div className="font-extrabold text-xl tracking-tight text-[#0D473B] leading-none">
                  rumbo<span className="text-[#10B981]">.</span>
                </div>
                <span className="text-[10px] font-medium text-slate-400">USM · San Joaquín</span>
              </div>
            </button>

            <div className="flex items-center gap-3">
              <select
                value={activeSemesterId}
                onChange={(e) => setActiveSemesterId(e.target.value)}
                className="bg-white border border-[#E2E4DC] text-slate-900 font-extrabold text-xs rounded-full px-4 py-1.5 shadow-2xs focus:outline-none cursor-pointer"
              >
                {semesters.map(s => (
                  <option key={s.id} value={s.id}>Semestre {s.name}</option>
                ))}
              </select>

              <button
                onClick={() => setActiveTab('admin')}
                className={`px-3.5 py-1.5 rounded-full font-extrabold text-xs transition-all border flex items-center gap-1.5 ${
                  activeTab === 'admin'
                    ? 'bg-[#0D473B] text-white border-[#0D473B] shadow-xs'
                    : 'bg-[#FAF9F5] text-slate-700 border-[#E2E4DC] hover:bg-white'
                }`}
              >
                <i className="fa-solid fa-gear text-xs"></i>
                <span>Administrador</span>
              </button>
            </div>
          </header>

          {/* LAYOUT PRINCIPAL CON SIDEBAR Y MAIN */}
          <div className="flex flex-1 pt-16 w-full">
            
            {/* SIDEBAR LATERAL */}
            <aside className="w-full md:w-72 bg-white border-b md:border-b-0 md:border-r border-[#E2E4DC] p-4 flex flex-col gap-6 flex-shrink-0">
              
              <div className="space-y-1 text-xs font-bold">
                <div className="px-3 py-1 text-[10px] font-black text-slate-400 uppercase tracking-wider">General</div>
                
                <button
                  onClick={() => setActiveTab('my_notes')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl transition-all ${
                    activeTab === 'my_notes'
                      ? 'bg-[#0D473B] text-white shadow-xs'
                      : 'text-slate-700 hover:bg-[#FAF9F5]'
                  }`}
                >
                  <i className="fa-solid fa-chart-simple w-4 text-center"></i>
                  <span>Mis Notas</span>
                </button>

                <button
                  onClick={() => setActiveTab('calendar')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl transition-all ${
                    activeTab === 'calendar'
                      ? 'bg-[#0D473B] text-white shadow-xs'
                      : 'text-slate-700 hover:bg-[#FAF9F5]'
                  }`}
                >
                  <i className="fa-solid fa-calendar-days w-4 text-center"></i>
                  <span>Calendario</span>
                </button>

                <button
                  onClick={() => setActiveTab('office_hours')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl transition-all ${
                    activeTab === 'office_hours'
                      ? 'bg-[#0D473B] text-white shadow-xs'
                      : 'text-slate-700 hover:bg-[#FAF9F5]'
                  }`}
                >
                  <i className="fa-solid fa-clock-user w-4 text-center"></i>
                  <span>Horarios DMat</span>
                </button>

                <button
                  onClick={() => setActiveTab('library')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl transition-all ${
                    activeTab === 'library'
                      ? 'bg-[#0D473B] text-white shadow-xs'
                      : 'text-slate-700 hover:bg-[#FAF9F5]'
                  }`}
                >
                  <i className="fa-solid fa-book-bookmark w-4 text-center"></i>
                  <span>Biblioteca Semestres</span>
                </button>

                <button
                  onClick={() => setActiveTab('admin')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl transition-all ${
                    activeTab === 'admin'
                      ? 'bg-[#0D473B] text-white shadow-xs'
                      : 'text-slate-700 hover:bg-[#FAF9F5]'
                  }`}
                >
                  <i className="fa-solid fa-sliders w-4 text-center"></i>
                  <span>Panel Administrador</span>
                </button>
              </div>

              {/* ASIGNATURAS INSCRITAS */}
              <div className="space-y-1">
                <div className="flex items-center justify-between px-3 py-1 text-[10px] font-black text-slate-400 uppercase tracking-wider">
                  <span>Mis Asignaturas ({currentSemester?.courses.length || 0})</span>
                  <button
                    onClick={() => setShowAddCourseToSemModal(activeSemesterId)}
                    className="hover:text-[#0D473B] font-bold text-sm"
                    title="Añadir asignatura"
                  >
                    +
                  </button>
                </div>

                {currentSemester?.courses.map(course => {
                  const isActive = activeCourseId === course.id && activeTab === 'my_notes';
                  const calc = calculateCourse(course);

                  return (
                    <button
                      key={course.id}
                      onClick={() => {
                        setActiveCourseId(course.id);
                        setActiveTab('my_notes');
                      }}
                      className={`w-full text-left p-2.5 rounded-2xl transition-all flex items-center justify-between ${
                        isActive
                          ? 'bg-[#E6F0EC] text-[#0D473B] font-extrabold shadow-2xs'
                          : 'hover:bg-[#FAF9F5] text-slate-800 font-bold'
                      }`}
                    >
                      <span className="text-xs truncate">{course.name}</span>
                      <span
                        className="text-[10px] px-2 py-0.5 rounded-md text-white font-bold flex-shrink-0"
                        style={{ backgroundColor: course.pastelBg || '#0D473B' }}
                      >
                        {course.code}
                      </span>
                    </button>
                  );
                })}
              </div>

            </aside>

            {/* CONTENIDO PRINCIPAL */}
            <main className="flex-1 overflow-y-auto p-4 sm:p-8 max-w-6xl mx-auto w-full">

              {/* TAB: MIS NOTAS */}
              {activeTab === 'my_notes' && (
                <div className="space-y-6">
                  {activeCourse ? (
                    <>
                      {/* HERO CARD DE RAMO */}
                      <div 
                        className="text-white rounded-3xl p-6 sm:p-8 shadow-md relative overflow-hidden"
                        style={{ backgroundColor: activeCourse.pastelBg || '#0D473B' }}
                      >
                        <div className="flex items-start justify-between gap-4">
                          <div>
                            <span className="px-3 py-1 rounded-full text-xs font-black bg-white/20 uppercase tracking-wide">
                              {activeCourse.code} · {activeCourse.credits} SCT
                            </span>
                            <h1 className="text-2xl sm:text-3xl font-black mt-3 leading-tight">
                              {activeCourse.fullName || activeCourse.name}
                            </h1>
                          </div>
                          <button
                            onClick={() => setShowRuleModal(true)}
                            className="px-4 py-2 bg-white/15 hover:bg-white/25 text-white font-extrabold text-xs rounded-xl border border-white/30 backdrop-blur-md transition-all"
                          >
                            📖 Ver reglas
                          </button>
                        </div>

                        <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mt-6">
                          <div>
                            <div className="text-xs font-bold text-white/80 uppercase">Nota Proyectada / Final</div>
                            <div className="text-5xl sm:text-6xl font-black">{activeCalc.finalGrade.toFixed(1)} <span className="text-lg opacity-80">/ 100.0</span></div>
                          </div>

                          <div className="text-sm font-extrabold bg-white/10 px-4 py-2 rounded-2xl border border-white/20">
                            Puntaje acumulado actual: <strong>{activeCalc.earnedPoints.toFixed(1)} pts</strong>
                          </div>
                        </div>
                      </div>

                      {/* NOTA REQUERIDA PARA APROBAR */}
                      <div className="bg-[#FEFCE8] border-2 border-[#FEF08A] rounded-2xl p-6 space-y-2">
                        <div className="text-xs font-black text-[#854D0E] uppercase tracking-wider">
                          Nota requerida para aprobar (55.0)
                        </div>
                        <div className="text-5xl font-black text-[#854D0E] leading-none">
                          {activeCalc.neededGrade.toFixed(1)}
                        </div>
                        <div className="text-sm font-bold text-[#713F12]">
                          Puntaje necesario en <strong>evaluaciones pendientes</strong> para asegurar la aprobación directa con 55.0.
                        </div>
                      </div>

                      {/* LAYOUT DE 2 COLUMNAS (TABLA + CARDS DERECHA FIEL A LA IMAGEN) */}
                      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        {/* COLUMNA IZQUIERDA (TABLA Y SIMULADOR) */}
                        <div className="lg:col-span-2 space-y-6">
                          
                          {/* TABLA DE EVALUACIONES */}
                          <div className="bg-white rounded-3xl p-6 border border-[#E2E4DC] shadow-2xs space-y-4">
                            <h3 className="font-extrabold text-base text-[#0D473B]">Evaluaciones y Ponderaciones</h3>
                            
                            <div className="overflow-x-auto">
                              <table className="w-full text-left text-xs sm:text-sm">
                                <thead className="bg-[#FAF9F5] text-slate-400 font-extrabold uppercase text-[10px] tracking-wider border-b border-[#E2E4DC]">
                                  <tr>
                                    <th className="py-2.5 px-3">Evaluación</th>
                                    <th className="py-2.5 px-3">Ponderación</th>
                                    <th className="py-2.5 px-3">Nota (0 - 100)</th>
                                    <th className="py-2.5 px-3">Fecha</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-[#E2E4DC]">
                                  {activeCourse.evaluations.map(ev => (
                                    <tr key={ev.id} className="hover:bg-[#FAF9F5] transition-colors">
                                      <td className="py-3 px-3 font-extrabold text-slate-900">{ev.name}</td>
                                      <td className="py-3 px-3 text-slate-500 font-bold">{ev.weight}%</td>
                                      <td className="py-3 px-3">
                                        <input
                                          type="number"
                                          min="0" max="100"
                                          placeholder="—"
                                          value={ev.grade !== undefined && ev.grade !== null ? ev.grade : ''}
                                          onFocus={(e) => e.target.select()}
                                          onChange={(e) => updateEvaluation(activeCourse.id, ev.id, 'grade', e.target.value)}
                                          className="w-20 border border-[#E2E4DC] rounded-xl px-2.5 py-1 font-black text-center text-sm focus:outline-none focus:border-[#0D473B]"
                                        />
                                      </td>
                                      <td className="py-3 px-3">
                                        <div className="flex items-center gap-1">
                                          <input
                                            type="date"
                                            value={ev.date || ''}
                                            onChange={(e) => updateEvaluation(activeCourse.id, ev.id, 'date', e.target.value)}
                                            className="bg-[#FAF9F5] border border-[#E2E4DC] rounded-lg px-2 py-1 text-xs font-bold"
                                          />
                                          {ev.date && (
                                            <button
                                              onClick={() => updateEvaluation(activeCourse.id, ev.id, 'date', '')}
                                              className="text-slate-400 hover:text-rose-600 font-bold px-1"
                                            >
                                              ✕
                                            </button>
                                          )}
                                        </div>
                                      </td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                          </div>

                          {/* SIMULADOR INTERACTIVO */}
                          <div className="bg-[#FAF5FF] border border-[#E9D5FF] rounded-3xl p-6 space-y-4">
                            <div>
                              <span className="text-[10px] font-black uppercase text-purple-700 tracking-wider block">HAY MÁS DE UN CAMINO</span>
                              <h4 className="text-lg font-black text-slate-900">¿Y si te va mejor en otra evaluación?</h4>
                              <p className="text-xs text-purple-800">Compara combinaciones y elige una para calcular en tiempo real.</p>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                              <div>
                                <label className="font-bold text-slate-600 block mb-1">Si en...</label>
                                <select
                                  value={simSourceEvId}
                                  onChange={(e) => setSimSourceEvId(e.target.value)}
                                  className="w-full bg-white border border-[#D8B4FE] rounded-xl px-3 py-2 font-extrabold text-slate-900"
                                >
                                  {pendingEvaluations.length > 0 ? (
                                    pendingEvaluations.map(e => (
                                      <option key={e.id} value={e.id}>{e.name} (Pendiente)</option>
                                    ))
                                  ) : (
                                    activeCourse.evaluations.map(e => (
                                      <option key={e.id} value={e.id}>{e.name}</option>
                                    ))
                                  )}
                                </select>
                              </div>

                              <div>
                                <label className="font-bold text-slate-600 block mb-1">Quiero calcular...</label>
                                <select
                                  value={simTargetType}
                                  onChange={(e) => setSimTargetType(e.target.value)}
                                  className="w-full bg-white border border-[#D8B4FE] rounded-xl px-3 py-2 font-extrabold text-slate-900"
                                >
                                  <option value="next">Otra nota pendiente</option>
                                  <option value="global">Certamen Global</option>
                                </select>
                              </div>
                            </div>

                            <div className="space-y-2">
                              {simulationRows.map((row, idx) => (
                                <div key={idx} className="bg-white p-3.5 rounded-2xl border border-[#F3E8FF] flex items-center justify-between gap-3">
                                  <div className="font-black text-xl text-purple-900 w-12">{row.sourceGrade}</div>
                                  <div className="font-extrabold text-sm text-slate-800 flex-1">
                                    Necesitas <strong className="text-purple-700 text-lg font-black">{row.needed.toFixed(1)}</strong> para obtener 55.0
                                  </div>
                                  <button
                                    onClick={() => {
                                      if (simSourceEvId) {
                                        updateEvaluation(activeCourse.id, simSourceEvId, 'grade', row.sourceGrade);
                                      }
                                    }}
                                    className="px-4 py-1.5 bg-[#E9D5FF] hover:bg-[#D8B4FE] text-purple-950 font-black text-xs rounded-xl transition-colors"
                                  >
                                    Probar →
                                  </button>
                                </div>
                              ))}
                            </div>
                          </div>

                        </div>

                        {/* COLUMNA DERECHA (CARDS FIEL A LA IMAGEN) */}
                        <div className="space-y-4">
                          
                          {/* CARD 1: LAS CONDICIONES DE TU RAMO */}
                          <div className="bg-white rounded-3xl p-5 border border-[#E2E4DC] shadow-2xs space-y-3">
                            <h3 className="font-black text-base text-slate-900">Las condiciones de tu ramo</h3>
                            
                            <div className="space-y-2.5">
                              {activeCalc.conditions.map((cond, idx) => (
                                <div key={idx} className="flex items-center justify-between text-xs py-1.5 border-b border-slate-100 last:border-none">
                                  <div className="flex items-center gap-2 font-bold text-slate-700">
                                    <span className={`w-2.5 h-2.5 rounded-full ${cond.passed ? 'bg-emerald-500' : 'bg-slate-300'}`}></span>
                                    <span>{cond.text}</span>
                                  </div>
                                  <span className={`px-2.5 py-0.5 rounded-full font-black text-[10px] ${
                                    cond.passed
                                      ? 'bg-emerald-100 text-emerald-900'
                                      : cond.label === 'Incumplida ✕'
                                      ? 'bg-rose-100 text-rose-900'
                                      : 'bg-slate-100 text-slate-600'
                                  }`}>
                                    {cond.label}
                                  </span>
                                </div>
                              ))}
                            </div>
                          </div>

                          {/* CARD 2: ✦ GLOBAL */}
                          <div className="bg-white rounded-3xl p-5 border border-[#E2E4DC] shadow-2xs space-y-3">
                            <div className="flex items-center justify-between">
                              <h3 className="font-black text-base text-slate-900 flex items-center gap-1.5">
                                <span className="text-amber-500">✦</span> Global
                              </h3>
                            </div>

                            <span className="inline-block px-3 py-1 bg-[#FEF3C7] text-[#854D0E] font-extrabold text-[11px] rounded-lg">
                              {activeCourse.extraConfig?.globalGrade ? 'Rendido' : 'Situación aún por definir'}
                            </span>

                            <p className="text-xs text-slate-500 leading-relaxed">
                              Voluntario. Reemplaza el peor certamen incluso si baja tu nota. No requiere un mínimo de presentación.
                            </p>

                            <div className="space-y-1">
                              <label className="text-[11px] font-extrabold text-slate-500 block">Nota de global</label>
                              <div className="flex items-center justify-between border border-[#E2E4DC] rounded-xl px-3 py-2 bg-white">
                                <input
                                  type="number"
                                  min="0" max="100"
                                  placeholder="—"
                                  value={activeCourse.extraConfig?.globalGrade || ''}
                                  onFocus={(e) => e.target.select()}
                                  onChange={(e) => updateGlobalGrade(activeCourse.id, e.target.value)}
                                  className="w-20 font-black text-lg text-slate-900 focus:outline-none"
                                />
                                <span className="text-xs font-bold text-slate-400">/100</span>
                              </div>
                            </div>
                          </div>

                          {/* CARD 3: TU META, CON CONTEXTO */}
                          <div className="bg-[#FAF9F5] rounded-3xl p-5 border border-[#E2E4DC] space-y-1">
                            <h4 className="font-black text-sm text-slate-900">Tu meta, con contexto.</h4>
                            <p className="text-xs text-slate-500 leading-relaxed">
                              Un promedio alto no siempre basta. Rumbo revisa también los requisitos específicos de este ramo.
                            </p>
                          </div>

                        </div>

                      </div>
                    </>
                  ) : (
                    <div className="bg-white rounded-3xl p-10 text-center border border-[#E2E4DC]">
                      <h3 className="text-lg font-black text-slate-900">No hay asignaturas en este semestre</h3>
                      <button
                        onClick={() => setShowAddCourseToSemModal(activeSemesterId)}
                        className="mt-4 px-4 py-2 bg-[#0D473B] text-white font-extrabold text-xs rounded-xl"
                      >
                        + Añadir Ramo
                      </button>
                    </div>
                  )}
                </div>
              )}

              {/* TAB: CALENDARIO DE EVALUACIONES */}
              {activeTab === 'calendar' && (
                <div className="space-y-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <h2 className="text-2xl font-black text-slate-900">📅 Calendario de Evaluaciones 2026</h2>
                      <p className="text-xs text-slate-500">Haz clic en cualquier casillero para ver o añadir eventos.</p>
                    </div>

                    <button
                      onClick={() => setShowAddEventModal(true)}
                      className="px-4 py-2.5 bg-[#0D473B] text-white font-extrabold text-xs rounded-2xl shadow-xs"
                    >
                      + Añadir Fecha / Evento
                    </button>
                  </div>

                  <div className="bg-white rounded-3xl border border-[#E2E4DC] p-6 space-y-4">
                    <div className="grid grid-cols-7 gap-2 text-center text-xs font-black text-slate-400 uppercase tracking-wider">
                      <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
                    </div>

                    <div className="grid grid-cols-7 gap-2">
                      {calendarGridDays.map((cell, idx) => {
                        if (!cell.isCurrentMonth) {
                          return <div key={idx} className="min-h-[85px] bg-[#FAF9F5]/40 rounded-2xl border border-transparent"></div>;
                        }

                        const hasEvents = cell.events && cell.events.length > 0;

                        return (
                          <div
                            key={idx}
                            onClick={() => setSelectedDayCell(cell)}
                            className={`min-h-[90px] p-2 rounded-2xl border transition-all cursor-pointer flex flex-col justify-between ${
                              hasEvents
                                ? 'bg-white border-[#0D473B] shadow-2xs'
                                : 'bg-white border-[#E2E4DC] hover:border-slate-400'
                            }`}
                          >
                            <span className="text-xs font-extrabold text-slate-700">{cell.dayNumber}</span>
                            
                            <div className="space-y-1 my-1 overflow-y-auto max-h-[55px]">
                              {cell.events?.map(ev => (
                                <div
                                  key={ev.id}
                                  className="px-1.5 py-0.5 rounded text-[9px] font-black truncate text-white"
                                  style={{ backgroundColor: ev.pastelBg || '#0D473B' }}
                                >
                                  {ev.courseCode} · {ev.title}
                                </div>
                              ))}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB: HORARIOS DE CONSULTA DMAT */}
              {activeTab === 'office_hours' && (
                <div className="space-y-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <h2 className="text-2xl font-black text-slate-900">👨‍🏫 Horarios de Consulta DMat</h2>
                      <p className="text-xs text-slate-500">Atención presencial de los 49 profesores del Departamento de Matemática (Campus San Joaquín 2026-2).</p>
                    </div>

                    <input
                      type="text"
                      placeholder="Buscar por profesor u oficina (ej. A-157)..."
                      value={profSearchTerm}
                      onChange={(e) => setProfSearchTerm(e.target.value)}
                      className="w-full sm:w-72 bg-white border border-[#E2E4DC] rounded-2xl px-4 py-2 font-bold text-xs text-slate-900"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {filteredProfessors.map(prof => (
                      <div key={prof.id} className="bg-white rounded-3xl p-5 border border-[#E2E4DC] space-y-2">
                        <div className="flex items-center justify-between">
                          <h3 className="font-extrabold text-sm text-[#0D473B]">{prof.name}</h3>
                          <span className="px-2 py-0.5 rounded-full text-[10px] font-black bg-emerald-100 text-emerald-900">
                            {prof.office}
                          </span>
                        </div>
                        <div className="text-xs text-slate-600 font-medium">⏰ {prof.hours}</div>
                        <div className="text-xs text-slate-500">📧 {prof.email}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB: BIBLIOTECA DE SEMESTRES */}
              {activeTab === 'library' && (
                <div className="space-y-6">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-2xl font-black text-slate-900">📚 Biblioteca de Semestres</h2>
                      <p className="text-xs text-slate-500">PPA Semestral y PPA Acumulado Global.</p>
                    </div>

                    <button
                      onClick={() => setShowAddSemesterModal(true)}
                      className="px-4 py-2 bg-[#0D473B] text-white font-extrabold text-xs rounded-2xl"
                    >
                      + Crear Nuevo Semestre
                    </button>
                  </div>

                  <div className="bg-[#0D473B] text-white rounded-3xl p-6 flex justify-between items-center shadow-md">
                    <div>
                      <span className="text-xs font-bold opacity-80 uppercase">PPA Acumulado Global</span>
                      <div className="text-4xl font-black">{globalPPA.toFixed(2)}</div>
                    </div>
                    <div className="text-xs font-bold opacity-80">{semesters.length} semestres creados</div>
                  </div>

                  <div className="space-y-4">
                    {semesters.map(sem => (
                      <div key={sem.id} className="bg-white rounded-3xl p-6 border border-[#E2E4DC] space-y-3">
                        <div className="flex items-center justify-between border-b border-[#E2E4DC] pb-3">
                          <h3 className="font-black text-lg text-slate-900">{sem.name}</h3>
                          <button
                            onClick={() => handleDeleteSemester(sem.id)}
                            className="text-xs text-rose-600 font-bold hover:underline"
                          >
                            Borrar Semestre
                          </button>
                        </div>

                        <div className="space-y-2">
                          {sem.courses.map(c => {
                            const res = calculateCourse(c);
                            return (
                              <div key={c.id} className="flex items-center justify-between p-3 rounded-2xl bg-[#FAF9F5] border border-[#E2E4DC]">
                                <span className="font-bold text-xs">{c.name} ({c.code})</span>
                                <span className="font-black text-xs text-[#0D473B]">{res.finalGrade.toFixed(1)}</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB: PANEL DE ADMINISTRADOR (MODO ADMIN) */}
              {activeTab === 'admin' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="text-2xl font-black text-slate-900">⚙️ Panel de Administración Rumbo</h2>
                    <p className="text-xs text-slate-500">Agrega, modifica y gestiona asignaturas del catálogo sin tocar una sola línea de código.</p>
                  </div>

                  <div className="flex flex-wrap gap-3">
                    <button
                      onClick={() => setShowCustomCourseModal(true)}
                      className="px-4 py-2.5 bg-[#0D473B] text-white font-extrabold text-xs rounded-2xl"
                    >
                      + Crear Ramo Manualmente
                    </button>

                    <button
                      onClick={() => setShowAutoParserModal(true)}
                      className="px-4 py-2.5 bg-purple-900 text-white font-extrabold text-xs rounded-2xl flex items-center gap-2"
                    >
                      <span>🤖 Creador Automático por Documento / Pauta</span>
                    </button>
                  </div>

                  <div className="bg-white rounded-3xl p-6 border border-[#E2E4DC] space-y-4">
                    <h3 className="font-black text-base text-slate-900">Catálogo de Ramos Disponibles ({catalog.length})</h3>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {catalog.map(preset => (
                        <div key={preset.code} className="p-4 rounded-2xl border border-[#E2E4DC] bg-[#FAF9F5] flex items-center justify-between">
                          <div>
                            <span className="font-mono font-black text-xs text-[#0D473B]">{preset.code}</span>
                            <h4 className="font-extrabold text-xs text-slate-900">{preset.name}</h4>
                            <span className="text-[10px] text-slate-400">{preset.credits} SCT</span>
                          </div>

                          <button
                            onClick={() => handleDeleteCatalogCourse(preset.code)}
                            className="px-3 py-1 bg-rose-100 text-rose-900 font-bold text-xs rounded-xl hover:bg-rose-200"
                          >
                            Eliminar
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

            </main>

          </div>

          {/* MODAL: AÑADIR FECHA / EVENTO CON SELECTOR DE RAMO + OPTION "PERSONAL" NEGRO */}
          {showAddEventModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 border border-[#E2E4DC]">
                <h3 className="font-black text-lg text-slate-900">Añadir Fecha / Evento</h3>

                <form onSubmit={handleAddEvent} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Título</label>
                    <input
                      type="text" required placeholder="Ej: Entrega Tarea 2"
                      value={eventTitle} onChange={e => setEventTitle(e.target.value)}
                      className="w-full bg-[#FAF9F5] border border-[#E2E4DC] rounded-xl px-3 py-2 font-bold"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Fecha</label>
                      <input
                        type="date" required value={eventDate} onChange={e => setEventDate(e.target.value)}
                        className="w-full bg-[#FAF9F5] border border-[#E2E4DC] rounded-xl px-3 py-2 font-bold"
                      />
                    </div>

                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Sigla Ramo</label>
                      <select
                        value={eventCourseCode}
                        onChange={e => setEventCourseCode(e.target.value)}
                        className="w-full bg-[#FAF9F5] border border-[#E2E4DC] rounded-xl px-3 py-2 font-extrabold text-slate-900"
                      >
                        <option value="">Elegir ramo...</option>
                        {currentSemester?.courses.map(c => (
                          <option key={c.id} value={c.code}>{c.code} - {c.name}</option>
                        ))}
                        <option value="PERSONAL">Personal (Color negro)</option>
                      </select>
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-3">
                    <button type="button" onClick={() => setShowAddEventModal(false)} className="px-4 py-2 font-bold text-slate-400">Cancelar</button>
                    <button type="submit" className="px-4 py-2 bg-[#0D473B] text-white font-extrabold rounded-xl">Guardar Fecha</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: CREADOR AUTOMÁTICO DE RAMOS POR PAUTA */}
          {showAutoParserModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 border border-[#E2E4DC]">
                <div>
                  <h3 className="font-black text-lg text-slate-900">🤖 Creador Automático por Documento / Pauta</h3>
                  <p className="text-xs text-slate-500">Pega el texto del syllabus o cronograma para generar la asignatura en el catálogo.</p>
                </div>

                <form onSubmit={handleAutoParsePauta} className="space-y-3 text-xs">
                  <textarea
                    required
                    placeholder="Ejemplo:
Asignatura: FIS120 Física Electromagnetismo (6 SCT)
Evaluaciones:
- Certamen 1 (25%)
- Certamen 2 (25%)
- Certamen 3 (25%)
- Controles (25%)"
                    value={pautaInputText}
                    onChange={e => setPautaInputText(e.target.value)}
                    className="w-full h-36 bg-[#FAF9F5] border border-[#E2E4DC] rounded-xl p-3 font-mono text-xs focus:outline-none"
                  ></textarea>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowAutoParserModal(false)} className="px-4 py-2 font-bold text-slate-400">Cancelar</button>
                    <button type="submit" className="px-4 py-2 bg-purple-900 text-white font-extrabold rounded-xl">Procesar y Crear</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: SELECCIONAR RAMO PARA SEMESTRE */}
          {showAddCourseToSemModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 max-h-[85vh] overflow-y-auto border border-[#E2E4DC]">
                <div className="flex items-center justify-between border-b border-[#E2E4DC] pb-3">
                  <h3 className="font-black text-base text-slate-900">Añadir Ramo a Semestre</h3>
                  <button onClick={() => setShowAddCourseToSemModal(null)} className="font-bold text-slate-400">✕</button>
                </div>

                <input
                  type="text"
                  placeholder="Buscar ramo en catálogo..."
                  value={catalogSearchTerm}
                  onChange={e => setCatalogSearchTerm(e.target.value)}
                  className="w-full bg-[#FAF9F5] border border-[#E2E4DC] rounded-xl px-3 py-2 font-bold text-xs"
                />

                <div className="space-y-2">
                  {filteredCatalog.map(preset => (
                    <div key={preset.code} className="p-3 rounded-2xl border border-[#E2E4DC] flex items-center justify-between">
                      <div>
                        <h4 className="font-extrabold text-xs text-slate-900">{preset.fullName} ({preset.code})</h4>
                        <span className="text-[10px] text-slate-400">{preset.credits} SCT</span>
                      </div>
                      <button
                        onClick={() => handleAddCourseToSemester(showAddCourseToSemModal, preset)}
                        className="px-3 py-1 bg-[#0D473B] text-white font-extrabold text-xs rounded-xl"
                      >
                        + Añadir
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODAL: DETALLE DÍA CALENDARIO */}
          {selectedDayCell && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 border border-[#E2E4DC]">
                <div className="flex items-center justify-between border-b border-[#E2E4DC] pb-3">
                  <h3 className="font-black text-base text-slate-900">Eventos del {selectedDayCell.dayNumber} de {MONTH_NAMES[currentMonthIdx]}</h3>
                  <button onClick={() => setSelectedDayCell(null)} className="font-bold text-slate-400">✕</button>
                </div>

                <div className="space-y-2">
                  {selectedDayCell.events?.length === 0 ? (
                    <div className="text-center py-4 text-xs text-slate-400">Sin eventos en este día.</div>
                  ) : (
                    selectedDayCell.events?.map(ev => (
                      <div key={ev.id} className="p-3 rounded-2xl border border-[#E2E4DC] bg-[#FAF9F5] flex items-center justify-between">
                        <div>
                          <h4 className="font-extrabold text-xs text-slate-900">{ev.title}</h4>
                          <span className="text-[10px] text-slate-500">{ev.courseCode}</span>
                        </div>
                        <button onClick={() => handleDeleteCalendarEvent(ev)} className="text-slate-400 hover:text-rose-600 font-bold">🗑️</button>
                      </div>
                    ))
                  )}
                </div>

                <button onClick={() => setSelectedDayCell(null)} className="w-full py-2 bg-[#0D473B] text-white font-extrabold text-xs rounded-xl">Cerrar</button>
              </div>
            </div>
          )}

          {/* MODAL: VER REGLAS DE RAMO */}
          {showRuleModal && activeCourse && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 border border-[#E2E4DC]">
                <div className="flex items-center justify-between border-b border-[#E2E4DC] pb-3">
                  <h3 className="font-black text-base text-slate-900">Reglas de {activeCourse.code}</h3>
                  <button onClick={() => setShowRuleModal(false)} className="font-bold text-slate-400">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="p-3 bg-[#FAF9F5] rounded-xl border border-[#E2E4DC] font-mono font-bold text-[#0D473B]">
                    {activeCourse.rules?.formula}
                  </div>
                  <ul className="space-y-1.5 text-slate-600">
                    {activeCourse.rules?.details?.map((item, idx) => (
                      <li key={idx}>• {item}</li>
                    ))}
                  </ul>
                </div>

                <button onClick={() => setShowRuleModal(false)} className="w-full py-2.5 bg-[#0D473B] text-white font-extrabold text-xs rounded-xl">Entendido</button>
              </div>
            </div>
          )}

          {/* MODAL: CREAR RAMO EN ADMINISTRADOR */}
          {showCustomCourseModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 border border-[#E2E4DC]">
                <h3 className="font-black text-lg text-slate-900">Crear Ramo en Catálogo</h3>

                <form onSubmit={handleCreateCatalogCourse} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Nombre</label>
                    <input type="text" required placeholder="Ej: Electromagnetismo" value={customName} onChange={e => setCustomName(e.target.value)} className="w-full bg-[#FAF9F5] border border-[#E2E4DC] rounded-xl px-3 py-2 font-bold" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Sigla</label>
                      <input type="text" placeholder="FIS120" value={customCode} onChange={e => setCustomCode(e.target.value)} className="w-full bg-[#FAF9F5] border border-[#E2E4DC] rounded-xl px-3 py-2 font-bold" />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">SCT</label>
                      <input type="number" min="1" max="20" value={customCredits} onChange={e => setCustomCredits(e.target.value)} className="w-full bg-[#FAF9F5] border border-[#E2E4DC] rounded-xl px-3 py-2 font-bold" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowCustomCourseModal(false)} className="px-4 py-2 font-bold text-slate-400">Cancelar</button>
                    <button type="submit" className="px-4 py-2 bg-[#0D473B] text-white font-extrabold rounded-xl">Crear en Catálogo</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: CREAR SEMESTRE */}
          {showAddSemesterModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 border border-[#E2E4DC]">
                <h3 className="font-black text-lg text-slate-900">Crear Semestre</h3>
                <form onSubmit={handleCreateSemester} className="space-y-3 text-xs">
                  <input type="text" required placeholder="Ej: 2027 · 1°" value={newSemName} onChange={e => setNewSemName(e.target.value)} className="w-full bg-[#FAF9F5] border border-[#E2E4DC] rounded-xl px-3 py-2 font-bold" />
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowAddSemesterModal(false)} className="px-4 py-2 font-bold text-slate-400">Cancelar</button>
                    <button type="submit" className="px-4 py-2 bg-[#0D473B] text-white font-extrabold rounded-xl">Crear</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
